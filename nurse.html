<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoinsDar — فضاء الممرض</title>
  <meta name="theme-color" content="#0A4D68" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen pb-28">

<!-- Top Header -->
<header class="sticky top-0 z-30 bg-gradient-to-b from-[#DFF3EA] via-[#ECF8F3] to-[#F2F8FF]/95 backdrop-blur border-b border-[#B6D8F2]">
  <div class="mx-auto flex max-w-xl items-center justify-between gap-2 px-4 py-3">
    <div class="flex items-center gap-2 min-w-0">
      <img src="./emblem-soinsdar.png" alt="SOINSDAR" class="h-11 w-auto shrink-0 object-contain" />
      <div class="min-w-0">
        <h1 id="hdrTitle" class="font-serif-brand text-base sm:text-lg font-extrabold leading-tight text-[#0A4D68]">فضاء الممرض</h1>
        <p id="hdrSub" class="mt-0.5 text-[11px] font-bold text-[#4A657A]">SOINSDAR • رعايتهم تجمعنا</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="ringtoneBtn" type="button" class="tap-btn flex h-9 w-9 items-center justify-center rounded-full border border-amber-300 bg-amber-50 text-amber-950" title="النغمة"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button id="pushBtn" type="button" class="tap-btn flex h-9 w-9 items-center justify-center rounded-full border border-rose-200 bg-rose-50 text-rose-900" title="الإشعارات"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
      <button id="langBtn" type="button" class="tap-btn rounded-full border border-[#CFE3F5] bg-[#FFFFFF] px-3 py-1.5 text-xs font-black text-[#0A4D68]">FR</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-xl space-y-4 px-4 pt-3">

  <!-- Block / Suspension Warning Banner -->
  <div id="blockWarnBox" class="hidden rounded-2xl border-2 border-rose-400 bg-rose-50 px-4 py-3 text-xs font-black text-rose-900"></div>

  <!-- FLOATING MODAL: VISIT REQUESTS (MANDATORY GPS GATE + GOOGLE MAPS) -->
  <div id="reqFloatingModal" class="hidden fixed inset-0 z-50 flex items-start pt-12 sm:items-center sm:pt-3 justify-center bg-slate-900/65 backdrop-blur-sm p-3">
    <div id="secRequests" class="w-full max-w-xl min-h-[55vh] max-h-[85vh] overflow-y-auto rounded-[28px] border border-[#CFE3F5] bg-[#F2F8FF] p-4 shadow-2xl space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-[#0A4D68] text-white shadow-sm">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4v5a4.5 4.5 0 009 0V4"/><path d="M9 13.5V16a5 5 0 0010 0v-2.5"/><circle cx="19" cy="11.5" r="2"/></svg>
          </div>
          <div class="min-w-0">
            <h2 id="reqHeading" class="truncate text-base font-black text-[#0A4D68]">الطلبات المتوفرة</h2>
            <p id="reqSub" class="truncate text-[11px] font-bold text-[#4A657A]">يتطلب تفعيل GPS لمشاهدة الطلبات القريبة</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="refreshReqBtn" type="button" class="tap-btn inline-flex items-center gap-1 rounded-xl border border-[#C2DBF0] bg-white px-2.5 py-1.5 text-xs font-black text-[#0A4D68]"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span>تحديث</span></button>
          <button id="closeReqModalBtn" type="button" aria-label="Close" class="tap-btn flex h-8 w-8 items-center justify-center rounded-xl border border-[#C2DBF0] bg-white text-sm font-black text-[#0B2538]">✕</button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-1.5 rounded-2xl bg-[#E3EFFB] p-1">
        <button id="subTabNew" type="button" class="inline-flex items-center justify-center gap-1 rounded-xl bg-[#0A4D68] px-2 py-2 text-xs font-black text-white">
          <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span>الجديدة (<span id="cntNew">0</span>)</span>
        </button>
        <button id="subTabAcc" type="button" class="inline-flex items-center justify-center gap-1 rounded-xl px-2 py-2 text-xs font-black text-[#334E63]">
          <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>المقبولة (<span id="cntAcc">0</span>)</span>
        </button>
        <button id="subTabHist" type="button" class="inline-flex items-center justify-center gap-1 rounded-xl px-2 py-2 text-xs font-black text-[#334E63]">
          <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>السجل</span>
        </button>
      </div>

      <div class="flex items-center justify-between gap-2 rounded-2xl border border-[#CFE3F5] bg-white px-3 py-2">
        <span class="inline-flex items-center gap-1.5 text-xs font-black text-[#0A4D68]">
          <svg class="h-4 w-4 text-[#0EA5E9]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>نطاق الطلبات:</span>
        </span>
        <select id="radiusFilterSel" class="rounded-xl border border-[#C2DBF0] bg-[#F2F8FF] px-2.5 py-1 text-xs font-black text-[#0B2538]">
          <option value="5000">5 كم</option>
          <option value="10000">10 كم</option>
          <option value="20000">20 كم</option>
          <option value="0">كل الولاية</option>
        </select>
      </div>
      <div id="reqStatusMsg" class="hidden rounded-2xl border border-emerald-300 bg-emerald-50 px-3.5 py-2 text-center text-xs font-black text-[#0A4D68]"></div>
      <div id="reqList" class="space-y-2.5"></div>
    </div>
  </div>

  <!-- TAB 1 (HOME): NURSE SUMMARY CARD + PATIENT DATA TABLE -->
  <section id="secPatients" class="space-y-3.5">
    <div id="nurseHomeProfileCard" class="rounded-[24px] border border-[#CFE3F5] bg-white p-4 shadow-sm"></div>
    <button id="openReqsCardBtn" type="button" class="tap-btn flex w-full items-center justify-between gap-3 rounded-[22px] bg-[#0A4D68] p-4 text-white shadow-md">
      <div class="flex items-center gap-3 text-start">
        <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-white/15">
          <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4v5a4.5 4.5 0 009 0V4"/><path d="M9 13.5V16a5 5 0 0010 0v-2.5"/><circle cx="19" cy="11.5" r="2"/></svg>
        </div>
        <div>
          <p id="openReqsCardTitle" class="text-sm font-black">الطلبات المتوفرة الآن</p>
          <p id="openReqsCardSub" class="text-[11px] font-bold text-sky-100">اضغط لفتح نافذة الطلبات الجديدة (يتطلب تفعيل GPS)</p>
        </div>
      </div>
      <span id="homeReqCntBadge" class="inline-flex h-8 min-w-[2rem] items-center justify-center rounded-full bg-white px-2.5 text-sm font-black text-[#0A4D68]">0</span>
    </button>
    <div id="patientsTableWrap" class="hidden cg-card p-3.5 space-y-2 overflow-x-auto"></div>
    <div class="cg-card p-4 space-y-2.5">
      <p id="linkTitle" class="text-sm font-black text-[#0A4D68]">🔗 ربط مسنّ عبر الرمز (CG-...)</p>
      <div class="flex gap-2">
        <input id="linkCodeInput" type="text" dir="ltr" placeholder="CG-123456" class="flex-1 rounded-xl border border-[#C2DBF0] bg-white px-3 py-2 text-sm font-black uppercase" />
        <button id="linkSubmitBtn" type="button" class="tap-btn rounded-xl bg-[#0A4D68] px-4 py-2 text-xs font-black text-white">ربط</button>
      </div>
      <p id="linkMsg" class="hidden text-xs font-extrabold"></p>
    </div>
    <div id="patientsList" class="space-y-3"></div>
    <div id="blockedPatientsBox" class="hidden cg-card p-4 space-y-2"></div>
  </section>

  <!-- TAB 3: NURSE PROFILE -->
  <section id="secProfile" class="hidden space-y-3.5">
    <div class="cg-card p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <h2 id="profHeading" class="text-lg font-black text-[#0A4D68]">🩺 ملف الممرض المهني</h2>
          <p id="profSub" class="text-xs font-bold text-[#4A657A]">بياناتك تظهر في دليل «أقرب ممرض»</p>
        </div>
        <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-black text-[#0A4D68]">🟢 موثّق</span>
      </div>

      <!-- Photo Upload inside Profile -->
      <div class="rounded-2xl border border-[#CFE3F5] bg-[#F2F8FF] px-3.5 py-2.5 space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <div id="profAvatarPreview" class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full border-2 border-[#B6D8F2] bg-[#0A4D68] text-base font-black text-white">🩺</div>
            <span id="profPhotoLbl" class="text-xs font-extrabold text-[#0B2538]">📷 صورة الممرض الشخصية</span>
          </div>
          <button type="button" id="profPhotoBtnLbl" class="tap-btn shrink-0 cursor-pointer rounded-xl bg-[#0A4D68] px-3.5 py-1.5 text-xs font-black text-white">تغيير الصورة</button>
          <input id="avatarFileInput" type="file" accept="image/*" class="sr-only" />
        </div>
        <p id="profPhotoStatus" class="hidden text-center text-[11px] font-extrabold"></p>
      </div>

      <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2">
        <input id="npFullName" type="text" placeholder="الاسم الكامل *" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold" />
        <select id="npCredential" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold">
          <option value="INF_MAJOR">ممرض رئيسي (Infirmier Major)</option>
          <option value="INF_PRINCIPAL">ممرض أول (Infirmier Principal)</option>
          <option value="IDE" selected>ممرض مجاز (IDE)</option>
          <option value="AIDE">عون تمريض (Aide-soignant)</option>
        </select>
        <select id="npGender" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold">
          <option value="male">👨‍⚕️ ممرض (Homme)</option>
          <option value="female">👩‍⚕️ ممرضة (Femme)</option>
        </select>
        <select id="npRegion" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold">
          <option value="">-- الولاية / Gouvernorat --</option>
          <option value="Tunis">Tunis / تونس</option><option value="Ariana">Ariana / أريانة</option>
          <option value="Ben Arous">Ben Arous / بن عروس</option><option value="Manouba">Manouba / منوبة</option>
          <option value="Nabeul">Nabeul / نابل</option><option value="Zaghouan">Zaghouan / زغوان</option>
          <option value="Bizerte">Bizerte / بنزرت</option><option value="Béja">Béja / باجة</option>
          <option value="Jendouba">Jendouba / جندوبة</option><option value="Kef">Le Kef / الكاف</option>
          <option value="Siliana">Siliana / سليانة</option><option value="Sousse">Sousse / سوسة</option>
          <option value="Monastir">Monastir / المنستير</option><option value="Mahdia">Mahdia / المهدية</option>
          <option value="Sfax">Sfax / صفاقس</option><option value="Kairouan">Kairouan / القيروان</option>
          <option value="Kasserine">Kasserine / القصرين</option><option value="Sidi Bouzid">Sidi Bouzid / سيدي بوزيد</option>
          <option value="Gabès">Gabès / قابس</option><option value="Médenine">Médenine / مدنين</option>
          <option value="Tataouine">Tataouine / تطاوين</option><option value="Gafsa">Gafsa / قفصة</option>
          <option value="Tozeur">Tozeur / توزر</option><option value="Kebili">Kébili / قبلي</option>
        </select>
        <input id="npCityZip" type="text" placeholder="المعتمدية / الحي (اختياري — مثال: الحامة، حي الأمل)" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold" />
        <input id="npPhone" type="tel" dir="ltr" placeholder="رقم الهاتف إجباري * (+216 ...)" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold" />
        <input id="npYearsExp" type="number" min="0" max="60" placeholder="سنوات الخبرة" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold" />
        <input id="npLanguages" type="text" placeholder="اللغات (العربية، Français...)" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold sm:col-span-2" />
        <input id="npSpecialties" type="text" placeholder="التخصصات (حقن، ضمادات، سكري...)" class="w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2.5 text-sm font-bold sm:col-span-2" />
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 rounded-2xl border border-[#CFE3F5] bg-[#F2F8FF] p-3">
        <button id="setGpsBtn" type="button" class="tap-btn inline-flex items-center gap-1.5 rounded-xl border border-[#0A4D68] bg-white px-3 py-2 text-xs font-black text-[#0A4D68]">
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>تحديد موقع العمل GPS</span>
        </button>
        <span id="gpsStatus" class="text-xs font-bold text-[#4A657A]"></span>
      </div>

      <label class="flex items-start gap-2 rounded-2xl border border-[#CFE3F5] bg-[#F2F8FF] p-2.5 text-[11px] font-bold text-[#0B2538]">
        <input id="npTermsAgree" type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 accent-[#0A4D68]" />
        <span id="termsLbl">أوافق على الشروط وسياسة التعليق الأسبوعي بعد 3 مرات حظر وعدم استرجاع الاشتراك عند المخالفة *</span>
      </label>

      <button id="saveProfileBtn" type="button" class="tap-btn w-full rounded-2xl bg-[#0A4D68] px-4 py-3 text-sm font-black text-white shadow-sm">حفظ ملف الممرض</button>
      <p id="profSaveMsg" class="hidden text-center text-xs font-extrabold"></p>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <button id="nrGuideBtn" type="button" class="tap-btn col-span-2 inline-flex items-center justify-center gap-2 rounded-2xl border border-[#B6D8F2] bg-[#E8F4FD] px-3 py-2.5 text-xs font-black text-[#0A4D68]">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>طريقة استعمال التطبيق (دليل الممرض)</span>
      </button>
      <button id="nrFeedbackBtn" type="button" class="tap-btn inline-flex items-center justify-center gap-1.5 rounded-2xl border border-[#C2DBF0] bg-[#F2F8FF] px-3 py-2.5 text-xs font-black text-[#0A4D68]">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>مراسلة / إبلاغ</span>
      </button>
      <a href="./privacy.html" class="tap-btn flex items-center justify-center gap-1.5 rounded-2xl border border-[#C2DBF0] bg-[#F2F8FF] px-3 py-2.5 text-xs font-black text-[#0B2538]">
        <svg class="h-4 w-4 shrink-0 text-[#0A4D68]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>الخصوصية</span>
      </a>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button id="switchRoleBtn" type="button" class="tap-btn inline-flex items-center justify-center gap-1.5 rounded-2xl border border-[#C2DBF0] bg-white px-4 py-3 text-xs font-black text-[#0B2538]">
        <svg class="h-4 w-4 shrink-0 text-[#0A4D68]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        <span>تغيير الدور</span>
      </button>
      <button id="signOutBtn" type="button" class="tap-btn inline-flex items-center justify-center gap-1.5 rounded-2xl border border-rose-300 bg-rose-50 px-4 py-3 text-xs font-black text-rose-900">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>تسجيل الخروج</span>
      </button>
    </div>
  </section>
</main>

<!-- Bottom Navigation (Nurse Only) -->
<nav class="fixed bottom-0 inset-x-0 z-30 border-t border-[#CFE3F5] bg-[#FFFFFF]/95 backdrop-blur">
  <div class="mx-auto grid max-w-xl grid-cols-3 py-2 text-center text-xs font-black">
    <button id="navPatients" type="button" class="flex flex-col items-center gap-1 text-[#0A4D68]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>
      <span id="navPatLbl">الرئيسية</span>
    </button>
    <button id="navRequests" type="button" class="flex flex-col items-center gap-1 text-[#4A657A]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4.5 4v5a4.5 4.5 0 009 0V4"/><path d="M9 13.5V16a5 5 0 0010 0v-2.5"/><circle cx="19" cy="11.5" r="2"/></svg>
      <span id="navReqLbl">الطلبات</span>
    </button>
    <button id="navProfile" type="button" class="flex flex-col items-center gap-1 text-[#4A657A]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

<script src="./shared.js"></script>
<script>
(function () {
  'use strict';
  const S = window.CG_SHARED;
  const $ = S.$;
  let user = null;
  let myProfile = null;
  let myAvatarUrl = "";
  let activeSubTab = 'new';
  let cachedReqs = [];
  let blockedBySet = new Set();
  let myBlockedList = [];
  let myBlockedSeniorIds = new Set();
  let myBlockedReqUids = new Set();

  function blkStorageKey() { return 'cg_v2_nurse_blocked_' + (user ? user.id : 'anon'); }
  function remLinksKey() { return 'cg_v2_nurse_removed_links_' + (user ? user.id : 'anon'); }
  function getRemovedLinkIds() {
    try { return new Set(JSON.parse(localStorage.getItem(remLinksKey()) || '[]')); } catch (_) { return new Set(); }
  }
  function addRemovedLinkId(id) {
    const s = getRemovedLinkIds(); s.add(id);
    try { localStorage.setItem(remLinksKey(), JSON.stringify([...s])); } catch (_) {}
  }
  function syncBlockedSets() {
    myBlockedSeniorIds = new Set(myBlockedList.map((x) => x.senior_id).filter(Boolean));
    myBlockedReqUids = new Set(myBlockedList.map((x) => x.senior_user_id).filter(Boolean));
  }
  async function loadMyBlockedPatients() {
    let localArr = [];
    try { localArr = JSON.parse(localStorage.getItem(blkStorageKey()) || '[]'); } catch (_) {}
    let dbArr = [];
    try {
      const { data, error } = await S.client.from('nurse_blocked_patients').select('senior_id, senior_user_id, senior_name').eq('nurse_user_id', user.id);
      if (!error && Array.isArray(data)) dbArr = data;
    } catch (_) {}
    const byKey = new Map();
    [...localArr, ...dbArr].forEach((item) => {
      const k = item.senior_id || item.senior_user_id;
      if (k) byKey.set(k, item);
    });
    myBlockedList = [...byKey.values()];
    syncBlockedSets();
  }
  async function blockPatientAndFamily(seniorId, seniorUserId, seniorName, linkId) {
    const entry = { senior_id: seniorId || null, senior_user_id: seniorUserId || null, senior_name: seniorName || 'مريض' };
    myBlockedList = myBlockedList.filter((x) => (seniorId ? x.senior_id !== seniorId : x.senior_user_id !== seniorUserId));
    myBlockedList.push(entry);
    syncBlockedSets();
    try { localStorage.setItem(blkStorageKey(), JSON.stringify(myBlockedList)); } catch (_) {}
    try {
      await S.client.from('nurse_blocked_patients').upsert({
        nurse_user_id: user.id,
        senior_id: entry.senior_id,
        senior_user_id: entry.senior_user_id,
        senior_name: entry.senior_name
      }, { onConflict: 'nurse_user_id,senior_id' });
    } catch (_) {}
    if (linkId) await removePatientLink(linkId);
  }
  async function unblockPatientAndFamily(seniorId, seniorUserId) {
    myBlockedList = myBlockedList.filter((x) => (seniorId ? x.senior_id !== seniorId : x.senior_user_id !== seniorUserId));
    syncBlockedSets();
    try { localStorage.setItem(blkStorageKey(), JSON.stringify(myBlockedList)); } catch (_) {}
    try {
      let q = S.client.from('nurse_blocked_patients').delete().eq('nurse_user_id', user.id);
      if (seniorId) q = q.eq('senior_id', seniorId);
      else if (seniorUserId) q = q.eq('senior_user_id', seniorUserId);
      await q;
    } catch (_) {}
  }
  async function removePatientLink(linkId) {
    addRemovedLinkId(linkId);
    try { await S.client.from('senior_care_links').delete().eq('id', linkId).eq('requester_user_id', user.id); } catch (_) {}
  }
  let suspendedUntil = null;
  let liveLat = null, liveLng = null;
  let chatSeniorId = null;

  let reqGpsVerified = false;
  let reqGpsChecking = false;
  let reqGpsError = '';

  function openRequestsModal() {
    reqGpsVerified = false;
    $('reqFloatingModal').classList.remove('hidden');
    $('navRequests').className = 'flex flex-col items-center gap-0.5 text-[#0A4D68]';
    verifyGpsForRequests();
  }

  function closeRequestsModal() {
    reqGpsVerified = false;
    $('reqFloatingModal').classList.add('hidden');
    const onProf = !$('secProfile').classList.contains('hidden');
    $('navRequests').className = 'flex flex-col items-center gap-0.5 text-[#4A657A]';
    $('navPatients').className = 'flex flex-col items-center gap-0.5 ' + (!onProf ? 'text-[#0A4D68]' : 'text-[#4A657A]');
  }

  async function verifyGpsForRequests() {
    reqGpsChecking = true;
    reqGpsError = '';
    renderRequests();
    if (!navigator.geolocation) {
      reqGpsChecking = false;
      reqGpsVerified = false;
      reqGpsError = S.getLang() === 'fr' ? 'GPS non pris en charge sur cet appareil.' : 'جهازك لا يدعم خدمة تحديد الموقع (GPS).';
      renderRequests();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        reqGpsChecking = false;
        reqGpsVerified = true;
        reqGpsError = '';
        if ($('gpsStatus')) {
          $('gpsStatus').dataset.lat = String(pos.coords.latitude);
          $('gpsStatus').dataset.lng = String(pos.coords.longitude);
        }
        loadRequests();
      },
      () => {
        reqGpsChecking = false;
        reqGpsVerified = false;
        reqGpsError = S.getLang() === 'fr'
          ? 'Veuillez activer le GPS / Localisation pour voir les demandes.'
          : 'يجب تفعيل خدمة الموقع (GPS) على هاتفك أولاً لمشاهدة الطلبات المتوفرة.';
        renderRequests();
      },
      { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
    );
  }

  function switchMainTab(tab) {
    if (tab === 'requests') {
      openRequestsModal();
      return;
    }
    closeRequestsModal();
    $('secPatients').classList.toggle('hidden', tab !== 'patients');
    $('secProfile').classList.toggle('hidden', tab !== 'profile');
    $('navPatients').className = 'flex flex-col items-center gap-0.5 ' + (tab === 'patients' ? 'text-[#0A4D68]' : 'text-[#4A657A]');
    $('navProfile').className = 'flex flex-col items-center gap-0.5 ' + (tab === 'profile' ? 'text-[#0A4D68]' : 'text-[#4A657A]');
    if (tab === 'patients') loadPatients();
    if (tab === 'profile') loadNurseProfile();
  }

  function applyTexts() {
    const isFr = S.getLang() === 'fr';
    $('langBtn').textContent = isFr ? 'عربي' : 'FR';
    $('hdrTitle').textContent = isFr ? 'Espace Infirmier' : 'فضاء الممرض';
    $('hdrSub').textContent = isFr ? 'SOINSDAR • La maison du bien-être' : 'SOINSDAR • رعايتهم تجمعنا';
    $('reqHeading').textContent = isFr ? 'Demandes disponibles' : 'الطلبات المتوفرة';
    $('reqSub').textContent = isFr ? 'GPS requis pour afficher les demandes proches' : 'يتطلب تفعيل GPS لمشاهدة الطلبات القريبة';
    if ($('openReqsCardTitle')) $('openReqsCardTitle').textContent = isFr ? 'Demandes disponibles maintenant' : 'الطلبات المتوفرة الآن';
    if ($('openReqsCardSub')) $('openReqsCardSub').textContent = isFr ? 'Appuyez pour ouvrir les nouvelles demandes (GPS requis)' : 'اضغط لفتح نافذة الطلبات الجديدة (يتطلب تفعيل GPS)';
    $('navReqLbl').textContent = isFr ? 'Demandes' : 'الطلبات';
    $('navPatLbl').textContent = isFr ? 'Accueil' : 'الرئيسية';
    if ($('linkTitle')) $('linkTitle').textContent = isFr ? '🔗 Lier un patient par code (CG-...)' : '🔗 ربط مسنّ عبر الرمز (CG-...)';
    if ($('linkSubmitBtn')) $('linkSubmitBtn').textContent = isFr ? 'Lier' : 'ربط';
    $('navProfLbl').textContent = isFr ? 'Mon profil' : 'ملفي';
    $('saveProfileBtn').textContent = isFr ? 'Enregistrer le profil' : 'حفظ ملف الممرض';
    $('switchRoleBtn').textContent = isFr ? '🔄 Changer de rôle' : '🔄 تغيير الدور';
    $('signOutBtn').textContent = isFr ? '🚪 Déconnexion' : '🚪 تسجيل الخروج';
  }

  function getCoords() {
    if (liveLat && liveLng) return { lat: liveLat, lng: liveLng };
    if (myProfile && myProfile.base_lat && myProfile.base_lng) return { lat: Number(myProfile.base_lat), lng: Number(myProfile.base_lng) };
    return null;
  }

  function distMeters(r) {
    const c = getCoords();
    if (!c || !r.senior_lat || !r.senior_lng) return null;
    return Math.round(S.haversineMeters(c.lat, c.lng, Number(r.senior_lat), Number(r.senior_lng)));
  }

  function getMyGovernorate() {
    if (myProfile && myProfile.region) return S.normGov(myProfile.region);
    const c = getCoords();
    return c ? S.normGov(S.detectTnGovernorate(c.lat, c.lng)) : '';
  }

  function getReqGovernorate(r) {
    if (r && r.region) return S.normGov(r.region);
    if (r && r.senior_lat && r.senior_lng) return S.normGov(S.detectTnGovernorate(r.senior_lat, r.senior_lng));
    return '';
  }

  function fmtDist(r, isFr) {
    const gRaw = (r && r.region) || (r && r.senior_lat && r.senior_lng ? S.detectTnGovernorate(r.senior_lat, r.senior_lng) : '');
    const gTxt = gRaw ? (' • 🏛️ ' + S.formatGovLabel(gRaw)) : '';
    const m = distMeters(r);
    if (m === null) return gTxt + (r.senior_lat ? (isFr ? ' • 📍 GPS prêt' : ' • 📍 الموقع جاهز') : '');
    if (m < 1000) return gTxt + (isFr ? ` • 📍 à ${m} m` : ` • 📍 يبعد ${m} م`);
    return gTxt + (isFr ? ` • 📍 à ${(Math.round(m / 100) / 10).toFixed(1)} km` : ` • 📍 يبعد ${(Math.round(m / 100) / 10).toFixed(1)} كم`);
  }

  function setSubTab(t) {
    activeSubTab = t;
    const on = 'rounded-xl bg-[#0A4D68] px-2 py-2 text-xs font-black text-white';
    const off = 'rounded-xl px-2 py-2 text-xs font-black text-[#334E63]';
    $('subTabNew').className = t === 'new' ? on : off;
    $('subTabAcc').className = t === 'accepted' ? on : off;
    $('subTabHist').className = t === 'history' ? on : off;
    renderRequests();
  }

  async function loadRequests() {
    if (!S.client || !user) return;
    const isFr = S.getLang() === 'fr';
    try {
      const [{ data: blks }, { data: np }] = await Promise.all([
        S.client.from('senior_blocked_nurses').select('senior_user_id').eq('nurse_user_id', user.id),
        S.client.from('nurse_profiles').select('*').eq('user_id', user.id).maybeSingle(),
        loadMyBlockedPatients()
      ]);
      blockedBySet = new Set((blks || []).map((b) => b.senior_user_id).filter(Boolean));
      if (np) myProfile = np;
      suspendedUntil = np && np.suspended_until ? np.suspended_until : null;
      const warn = $('blockWarnBox');
      if (suspendedUntil && new Date(suspendedUntil).getTime() > Date.now()) {
        warn.classList.remove('hidden');
        warn.textContent = isFr
          ? `⛔ Compte suspendu 7 jours jusqu'au ${new Date(suspendedUntil).toLocaleDateString()}.`
          : `⛔ حسابك معلّق لمدة أسبوع حتى ${new Date(suspendedUntil).toLocaleDateString()} بسبب 3 مرات حظر.`;
      } else if (blockedBySet.size > 0) {
        warn.classList.remove('hidden');
        warn.textContent = isFr
          ? `⚠️ ${blockedBySet.size} patient(s) ont bloqué vos services (3 blocages = 7 jours de suspension).`
          : `⚠️ قام ${blockedBySet.size} من المستفيدين بحظر التعامل معك (3 مرات حظر = تعليق أسبوع).`;
      } else {
        warn.classList.add('hidden');
      }
    } catch (_) {}

    const { data } = await S.client
      .from('nurse_visit_requests')
      .select('*')
      .or(`nurse_user_id.eq.${user.id},request_mode.eq.open,accepted_by_user_id.eq.${user.id}`)
      .order('created_at', { ascending: false })
      .limit(100);
    cachedReqs = data || [];
    renderRequests();
  }

  function renderRequests() {
    const isFr = S.getLang() === 'fr';
    const listEl = $('reqList');
    const myGender = (myProfile && myProfile.gender) || 'male';
    const isBanned = !!(myProfile && myProfile.is_banned);
    const isSusp = isBanned || !!(suspendedUntil && new Date(suspendedUntil).getTime() > Date.now()) || !!(myProfile && myProfile.suspended_until && new Date(myProfile.suspended_until).getTime() > Date.now());

    const accReqs = cachedReqs.filter((r) => r.status === 'accepted' && !r.nurse_outcome && (r.accepted_by_user_id === user.id || r.nurse_user_id === user.id));
    const unratedComp = cachedReqs.find((r) => r.status === 'completed' && (r.patient_rating === null || r.patient_rating === undefined) && (r.accepted_by_user_id === user.id || r.nurse_user_id === user.id));
    const newReqs = isSusp ? [] : cachedReqs.filter((r) => {
      if (r.requester_user_id && (blockedBySet.has(r.requester_user_id) || myBlockedReqUids.has(r.requester_user_id))) return false;
      if (r.senior_id && myBlockedSeniorIds.has(r.senior_id)) return false;
      if (r.status === 'pending' && r.nurse_user_id === user.id) return true;
      if (r.request_mode === 'open' && r.status === 'open') {
        const pg = r.preferred_gender || 'any';
        if (!(pg === 'any' || pg === myGender)) return false;
        const myG = getMyGovernorate();
        const rG = getReqGovernorate(r);
        const dm = distMeters(r);
        if (myG && rG && myG !== rG) return false;
        const maxDist = Number(($('radiusFilterSel') && $('radiusFilterSel').value) || 5000);
        if (maxDist > 0 && dm !== null && dm > maxDist) return false;
        return true;
      }
      return false;
    });
    newReqs.sort((a, b) => {
      const da = distMeters(a), db = distMeters(b);
      if (da !== null && db !== null) return da - db;
      if (da !== null) return -1;
      if (db !== null) return 1;
      return new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime();
    });
    const histReqs = cachedReqs.filter((r) => (r.status === 'completed' || r.status === 'declined') && (r.accepted_by_user_id === user.id || r.nurse_user_id === user.id));

    $('cntNew').textContent = String(newReqs.length);
    $('cntAcc').textContent = String(accReqs.length);
    if ($('homeReqCntBadge')) $('homeReqCntBadge').textContent = String(reqGpsVerified ? newReqs.length : 'GPS');
    listEl.replaceChildren();

    if (activeSubTab === 'new' && !reqGpsVerified) {
      const gpsBox = document.createElement('div');
      gpsBox.className = 'cg-card p-5 text-center space-y-3 border-2 border-amber-300 bg-amber-50';
      const ico = document.createElement('div');
      ico.className = 'mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-200/70 text-[#0A4D68]';
      ico.innerHTML = '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>';
      const msg = document.createElement('p');
      msg.className = 'text-xs font-black text-amber-950 leading-relaxed';
      msg.textContent = reqGpsChecking
        ? (isFr ? '⏳ Vérification de la position GPS...' : '⏳ جاري التحقق من تفعيل الـ GPS...')
        : (reqGpsError || (isFr ? 'Activez le GPS sur votre téléphone pour voir les demandes. Aucune demande ne s\'affichera sans GPS.' : 'يرجى تفعيل خدمة الموقع (GPS) على هاتفك لمشاهدة الطلبات. لن يظهر أي طلب بدون تفعيل الـ GPS.'));
      gpsBox.append(ico, msg);
      if (!reqGpsChecking) {
        const retryBtn = document.createElement('button');
        retryBtn.id = 'retryReqGpsBtn';
        retryBtn.type = 'button';
        retryBtn.className = 'tap-btn inline-flex items-center justify-center gap-1.5 rounded-xl bg-[#0A4D68] px-4 py-2.5 text-xs font-black text-white shadow-sm';
        retryBtn.textContent = isFr ? 'Activer le GPS et actualiser' : 'تفعيل الـ GPS ومشاهدة الطلبات';
        retryBtn.addEventListener('click', verifyGpsForRequests);
        gpsBox.appendChild(retryBtn);
      }
      listEl.appendChild(gpsBox);
      return;
    }

    if (activeSubTab === 'new' && isSusp) {
      const b = document.createElement('div');
      b.className = 'cg-card p-5 text-center text-xs font-black text-rose-900';
      b.textContent = isFr ? '⛔ Compte temporairement suspendu.' : '⛔ حسابك معلّق مؤقتاً ولا يمكنك استقبال طلبات جديدة.';
      listEl.appendChild(b);
      return;
    }

    if (activeSubTab === 'new' && unratedComp) {
      const gate = document.createElement('div');
      gate.className = 'rounded-3xl border-2 border-amber-400 bg-amber-50 p-4 space-y-3';
      const gp = document.createElement('p');
      gp.className = 'text-xs font-black text-amber-950 leading-relaxed';
      gp.textContent = isFr
        ? `⭐ Évaluez d'abord votre dernière visite (${unratedComp.requester_name || 'Patient'}) avant d'accepter une nouvelle demande.`
        : `⭐ يجب تقييم الزيارة السابقة (${unratedComp.requester_name || 'المستفيد'} — ${unratedComp.care_reason || ''}) قبل استلام أي طلب جديد.`;
      let pRating = 5;
      const stars = document.createElement('div'); stars.className = 'flex justify-center gap-2';
      const sBtns = [];

  async function acceptReq(r) {
    const unrated = cachedReqs.find((x) => x.status === 'completed' && (x.patient_rating === null || x.patient_rating === undefined) && (x.accepted_by_user_id === user.id || x.nurse_user_id === user.id));
    if (unrated) {
      alert(S.getLang() === 'fr' ? 'Veuillez évaluer votre visite précédente avant d\'en accepter une nouvelle.' : 'يرجى تقييم زيارتك السابقة أولاً قبل قبول طلب جديد.');
      renderRequests();
      return;
    }
    S.stopRingtone();
    const isFr = S.getLang() === 'fr';
    const myName = (myProfile && myProfile.full_name) || (user.user_metadata && user.user_metadata.full_name) || 'ممرض';
    let ok = false;
    if (r.request_mode === 'open') {
      const { data: rpcOk, error: rpcErr } = await S.client.rpc('accept_open_visit_request', { req_id: r.id, nurse_uid: user.id, nurse_nm: myName });
      if (!rpcErr && rpcOk) ok = true;
    } else {
      const { data: upd } = await S.client.from('nurse_visit_requests').update({ status: 'accepted', accepted_by_user_id: user.id, accepted_by_name: myName, accepted_at: new Date().toISOString() }).eq('id', r.id).eq('status', 'pending').select('id');
      ok = !!(upd && upd.length);
    }
    const msgEl = $('reqStatusMsg');
    msgEl.classList.remove('hidden');
    msgEl.textContent = ok
      ? (isFr ? '✅ Visite acceptée ! Ouvrez Google Maps ci-dessous.' : '✅ تم قبول الطلب! استخدم زر Google Maps للتوجيه للمنزل.')
      : (isFr ? '⚠️ Déjà acceptée par un autre infirmier.' : '⚠️ سبقك ممرض آخر لقبول هذا الطلب.');
    await loadRequests();
    if (ok) setSubTab('accepted');
  }

  function formatAlertDisplay(al, seniorName, isFr) {
    const raw = String((al && al.message) || (al && al.alert_type) || '');
    const mapMatch = raw.match(/https?:\/\/maps\.google\.com\/\?q=[^\s]+/);
    const mapUrl = mapMatch ? mapMatch[0] : '';
    const clean = raw.replace(/https?:\/\/maps\.google\.com\/\?q=[^\s]+/g, '').replace(/[—\-\s]+$/, '').trim();
    const nm = seniorName || (isFr ? 'Le senior' : 'المسنّ');
    let text = clean;

    if (/left home zone/i.test(clean) || (al && al.alert_type === 'left_home' && /away/i.test(clean))) {
      const dm = clean.match(/\(([^)]+)\s*away\)/i);
      const dist = dm ? dm[1].replace(/m$/i, isFr ? ' m' : ' م').replace(/km$/i, isFr ? ' km' : ' كم') : '';
      text = isFr
        ? `📍 ${nm} a quitté le domicile${dist ? ' (' + dist + ')' : ''}`
        : `📍 ابتعد ${nm} عن مكان الإقامة المسجّل${dist ? ' (' + dist + ')' : ''}`;
    } else if (/has not checked in for\s*(\d+h)/i.test(clean)) {
      const h = clean.match(/(\d+h)/i)[1];
      const hrs = h.replace('h', '');
      text = isFr
        ? `🟠 Alerte (${h}) : ${nm} n'a pas confirmé sa sécurité depuis ${h}`
        : `🟠 تنبيه (${hrs} ساعات): ${nm} لم يؤكد سلامته منذ ${hrs} ساعات`;
    } else if (/has not confirmed safety for\s*10\+\s*hours/i.test(clean) || /URGENT\s*\(10h\+\)/i.test(clean)) {
      text = isFr
        ? `🚨 URGENT (10h+) : ${nm} n'a pas confirmé sa sécurité depuis plus de 10 heures !`
        : `🚨 عاجل (+10 ساعات): ${nm} لم يؤكد سلامته منذ أكثر من 10 ساعات!`;
    } else if (/battery/i.test(clean) && !/[\u0600-\u06FF]/.test(clean) && !isFr) {
      const pct = (clean.match(/(\d+%)/) || [])[1] || '';
      text = `🔋 بطارية هاتف ${nm} منخفضة${pct ? ' (' + pct + ')' : ''} — يرجى شحن الهاتف`;
    } else if (/missed/i.test(clean) && !/[\u0600-\u06FF]/.test(clean) && !isFr) {
      text = `💊 تنبيه دواء فائت: لم يتم تأكيد تناول الدواء في موعده (${nm})`;
    }
    return { text: text || (isFr ? 'Alerte active' : 'تنبيه نشط'), mapUrl };
  }

    const box = $('patientsList');

      .from('senior_care_links')
      .select('id, senior_id, status, senior_profiles(id, user_id, display_name, senior_phone, blood_type, allergies, conditions, home_address, water_count, water_date)')
      .eq('requester_user_id', user.id);
    await loadMyBlockedPatients();
    const remIds = getRemovedLinkIds();
    const visibleLinks = (links || []).filter((lk) => !remIds.has(lk.id) && !(lk.senior_id && myBlockedSeniorIds.has(lk.senior_id)));
    renderNurseHomeCard();
    const tblWrap = $('patientsTableWrap');
    if (tblWrap) tblWrap.replaceChildren();
    box.replaceChildren();
    renderBlockedPatientsBox();
    if (!visibleLinks.length) {
      const p = document.createElement('div');
      p.className = 'cg-card p-6 text-center text-xs font-bold text-[#4A657A]';

      box.appendChild(p);
      return;
    }
    const todayStart = S.getLocalDayStartIso();
    const enriched = await Promise.all(visibleLinks.map(async (lk) => {
      if (lk.status !== 'approved') return { lk, approved: false };
      const sp = lk.senior_profiles || { id: lk.senior_id, display_name: 'المسنّ' };
      const [{ data: meds }, { data: logs }, { data: alerts }] = await Promise.all([
        S.client.from('medications').select('id, name, dosage').eq('senior_id', sp.id),
        S.client.from('medication_logs').select('medication_id, status, logged_at').eq('senior_id', sp.id).gte('logged_at', todayStart),
        S.client.from('alerts').select('id, message, alert_type, created_at').eq('senior_id', sp.id).eq('status', 'open').order('created_at', { ascending: false }).limit(5)
      ]);
      const takenSet = new Set((logs || []).filter((l) => l.status === 'taken').map((l) => l.medication_id));
      const takenTimeMap = new Map();
      (logs || []).forEach((l) => {
        if (l.status === 'taken' && l.logged_at) {
          takenTimeMap.set(l.medication_id, new Date(l.logged_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }
      });
      return { lk, approved: true, sp, meds: meds || [], takenSet, takenTimeMap, alerts: alerts || [] };
    }));

    const approvedItems = enriched.filter((x) => x.approved);
    if (tblWrap && approvedItems.length) {
      tblWrap.classList.remove('hidden');

      thTitle.className = 'text-sm font-black text-[#0A4D68]';

      const tbody = document.createElement('tbody');
      approvedItems.forEach(({ sp, meds, takenSet, alerts }) => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-[#F2EAE0] last:border-0 font-bold text-[#0B2538]';
        const td1 = document.createElement('td'); td1.className = 'py-2 pe-2 font-black'; td1.textContent = sp.display_name || '-';
        const td2 = document.createElement('td'); td2.className = 'py-2 px-1 text-center text-rose-700'; td2.textContent = sp.blood_type || '-';
        const td3 = document.createElement('td'); td3.className = 'py-2 px-1 text-center text-[#0A4D68]'; td3.textContent = `${takenSet.size}/${meds.length}`;

  function compressAvatar(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 256;
          const scale = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => resolve(String(reader.result || ''));
        img.src = String(reader.result || '');
      };
      reader.readAsDataURL(file);
    });
  }

      ['nurseHdrAvatar', 'profAvatarPreview'].forEach((id) => {
        const el = $(id); if (!el) return;
        el.replaceChildren();
        const img = document.createElement('img');
        img.src = dataUrl; img.className = 'h-full w-full object-cover';
        el.appendChild(img);
      });
      renderNurseHomeCard();
      st.className = 'text-center text-[11px] font-extrabold text-[#0A4D68]';
      st.textContent = isFr ? '✅ Photo enregistrée avec succès !' : '✅ تم حفظ صورتك الشخصية بنجاح!';
    } catch (err) {
      st.className = 'text-center text-[11px] font-extrabold text-rose-800';
      st.textContent = '⚠️ ' + ((err && err.message) || (isFr ? 'Erreur de téléversement' : 'تعذر حفظ الصورة'));
    }
    e.target.value = '';
  });

  $('setGpsBtn').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition((pos) => {
      liveLat = pos.coords.latitude; liveLng = pos.coords.longitude;
      $('gpsStatus').dataset.lat = String(liveLat);
      $('gpsStatus').dataset.lng = String(liveLng);
      $('gpsStatus').textContent = `✓ ${liveLat.toFixed(3)}, ${liveLng.toFixed(3)}`;
    });
  });

  $('linkSubmitBtn').addEventListener('click', async () => {
    const isFr = S.getLang() === 'fr';
    const code = ($('linkCodeInput').value || '').trim().toUpperCase();
    const msg = $('linkMsg');
    if (!code) return;
    try {
      const { data: freshNp } = await S.client.from('nurse_profiles').select('is_banned, suspended_until').eq('user_id', user.id).maybeSingle();
      if (freshNp && (freshNp.is_banned || (freshNp.suspended_until && new Date(freshNp.suspended_until).getTime() > Date.now()))) {
        msg.className = 'text-xs font-extrabold text-rose-800';
        msg.textContent = freshNp.is_banned
          ? (isFr ? '⛔ Compte banni — liaison désactivée.' : '⛔ حسابك محظور — لا يمكنك إرسال طلب ربط.')
          : (isFr ? '⛔ Compte suspendu — liaison désactivée.' : '⛔ حسابك معلّق مؤقتاً — لا يمكنك إرسال طلب ربط.');
        msg.classList.remove('hidden');
        return;
      }
    } catch (_) {}
    const myName = (myProfile && myProfile.full_name) || (user && user.user_metadata && user.user_metadata.full_name) || (isFr ? 'Infirmier' : 'ممرض');
    const { error } = await S.client.rpc('request_link_by_code', {
      p_code: code,
      p_role: 'nurse',
      p_name: myName
    });
    msg.className = error ? 'text-xs font-extrabold text-rose-800' : 'text-xs font-extrabold text-emerald-800';
    msg.textContent = error
      ? ('⚠️ ' + (error.message || (isFr ? 'Code introuvable' : 'رمز غير موجود')))
      : (isFr ? '✓ Demande envoyée — en attente de validation du senior.' : '✓ تم إرسال طلب الربط — بانتظار موافقة المسنّ.');
    msg.classList.remove('hidden');
    if (!error) {
      try { localStorage.removeItem(remLinksKey()); } catch (_) {}
      $('linkCodeInput').value = '';
      loadPatients();
    }
  });

  if ($('radiusFilterSel')) {
    try {
      const savedR = localStorage.getItem('cg_nurse_radius_m');
      if (savedR !== null) $('radiusFilterSel').value = savedR;
    } catch (_) {}
    $('radiusFilterSel').addEventListener('change', (e) => {
      try { localStorage.setItem('cg_nurse_radius_m', e.target.value); } catch (_) {}
      renderRequests();
    });
  }
  if (S.attachImagePicker) {
    S.attachImagePicker($('chatImgBtn'), async (imgData) => {
      if (!chatSeniorId || !imgData) return;
      await S.client.from('care_direct_messages').insert({
        senior_id: chatSeniorId, sender_user_id: user.id,
        sender_name: (myProfile && myProfile.full_name) || 'ممرض',
        sender_role: 'nurse', channel: 'nurse', message_text: '__IMG__:' + imgData
      });
      loadChat();
    });
  }
  S.attachVoiceRecorder($('chatMicBtn'), async (audioData) => {
    if (!chatSeniorId || !audioData) return;
    await S.client.from('care_direct_messages').insert({
      senior_id: chatSeniorId, sender_user_id: user.id,
      sender_name: (myProfile && myProfile.full_name) || 'ممرض',
      sender_role: 'nurse', channel: 'nurse', audio_data: audioData
    });
    loadChat();
  });
  $('chatSendBtn').addEventListener('click', async () => {
    const txt = ($('chatInput').value || '').trim();
    if (!txt || !chatSeniorId) return;
    $('chatInput').value = '';
    await S.client.from('care_direct_messages').insert({
      senior_id: chatSeniorId,
      sender_user_id: user.id,
      sender_name: (myProfile && myProfile.full_name) || 'ممرض',
      sender_role: 'nurse',
      channel: 'nurse',
      message_text: txt
    });
    loadChat();
  });

  // Wiring
  $('navRequests').addEventListener('click', () => switchMainTab('requests'));
  $('navPatients').addEventListener('click', () => switchMainTab('patients'));
  $('navProfile').addEventListener('click', () => switchMainTab('profile'));
  $('subTabNew').addEventListener('click', () => setSubTab('new'));
  $('subTabAcc').addEventListener('click', () => setSubTab('accepted'));
  $('subTabHist').addEventListener('click', () => setSubTab('history'));
  if ($('closeReqModalBtn')) $('closeReqModalBtn').addEventListener('click', closeRequestsModal);
  if ($('openReqsCardBtn')) $('openReqsCardBtn').addEventListener('click', openRequestsModal);
  $('refreshReqBtn').addEventListener('click', async () => {
    const btn = $('refreshReqBtn');
    verifyGpsForRequests(); if (!reqGpsVerified) return;
    const lbl = btn ? btn.querySelector('span') : null;
    const svg = btn ? btn.querySelector('svg') : null;
    const isFr = S.getLang() === 'fr';
    if (btn) btn.disabled = true;
    if (svg) svg.classList.add('animate-spin');
    if (lbl) lbl.textContent = isFr ? 'Actualisation...' : 'جاري التحديث...';
    try { await loadRequests(); } catch (_) {}
    if (svg) svg.classList.remove('animate-spin');
    if (lbl) lbl.textContent = isFr ? 'À jour ✓' : 'تم التحديث ✓';
    setTimeout(() => {
      if (lbl) lbl.textContent = isFr ? 'Actualiser' : 'تحديث';
      if (btn) btn.disabled = false;
    }, 1200);
  });
  $('closeChatBtn').addEventListener('click', () => $('chatModal').classList.add('hidden'));
  $('langBtn').addEventListener('click', () => { S.setLang(S.getLang() === 'fr' ? 'ar' : 'fr'); applyTexts(); renderRequests(); if (!$('secPatients').classList.contains('hidden')) loadPatients(); });
  $('switchRoleBtn').addEventListener('click', () => { window.location.href = './index.html?choose=1'; });
  $('signOutBtn').addEventListener('click', S.signOut);
  if ($('nrGuideBtn')) $('nrGuideBtn').addEventListener('click', () => S.showOnboardingModal && S.showOnboardingModal('nurse', user && user.id, true));
  if ($('nrFeedbackBtn')) $('nrFeedbackBtn').addEventListener('click', () => S.openFeedbackModal(user, 'nurse', (myProfile && myProfile.full_name) || 'ممرض'));

  $('pushBtn').addEventListener('click', async () => {
    const r = await S.toggleWebPush(user);
    if (r.ok) {
      $('pushBtn').className = r.active
        ? 'tap-btn rounded-full bg-emerald-700 px-2.5 py-1.5 text-xs font-black text-white'
        : 'tap-btn rounded-full border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-xs font-black text-rose-900';
      $('pushBtn').textContent = r.active ? '🔔 ✓' : '🔔';
    }
  });

  $('ringtoneBtn').addEventListener('click', () => {
    $('ringPresetSel').value = localStorage.getItem(S.CONFIG.RINGTONE_KEY) || 'loud_phone';
    if (S.renderRingtoneStudio) S.renderRingtoneStudio($('ringStudioList')); $('ringtoneModal').classList.remove('hidden');
  });
  $('closeRingModalBtn').addEventListener('click', () => { S.stopRingtone(); $('ringtoneModal').classList.add('hidden'); });
  $('ringPresetSel').addEventListener('change', (e) => { localStorage.setItem(S.CONFIG.RINGTONE_KEY, e.target.value); if (e.target.value !== 'custom_file') S.playStrongRingtone(e.target.value); });
  $('testRingBtn').addEventListener('click', () => S.playStrongRingtone());
  $('stopRingBtn').addEventListener('click', S.stopRingtone);
  $('customRingFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        localStorage.setItem('cg_v2_custom_ringtone_url', String(r.result || ''));
        localStorage.setItem(S.CONFIG.RINGTONE_KEY, 'custom_file');
        $('ringPresetSel').value = 'custom_file';
        $('customRingStatus').textContent = '✓ ' + f.name;
      } catch (_) { $('customRingStatus').textContent = '⚠️ الملف كبير جداً (اختر ملفاً أقل من 2MB)'; }
    };
    r.readAsDataURL(f);
  });

  // Boot
  (async function init() {
    applyTexts();
    user = await S.requireAuth(['nurse', 'center']);
    if (!user) return;
    if (S.showOnboardingModal) S.showOnboardingModal('nurse', user.id);
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((p) => { liveLat = p.coords.latitude; liveLng = p.coords.longitude; renderRequests(); }, () => {}, { timeout: 5000 });
    }
    await loadNurseProfile();
    switchMainTab('patients');
    loadRequests();
    let nurseRt = null;
    function connectNurseRt() {
      if (nurseRt || document.hidden) return;
      nurseRt = S.client.channel('cg-v2-nurse-' + user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'nurse_visit_requests' }, async (payload) => {
        await loadRequests();
        if (payload.eventType === 'INSERT' && payload.new) {
          const r = payload.new;
          const myG = (myProfile && myProfile.gender) || 'male';
          const pg = r.preferred_gender || 'any';
          const okG = pg === 'any' || pg === myG;
          const isMyBlk = (r.senior_id && myBlockedSeniorIds.has(r.senior_id)) || (r.requester_user_id && myBlockedReqUids.has(r.requester_user_id));
          const myGov = getMyGovernorate();
          const reqGov = getReqGovernorate(r);
          const dmRt = distMeters(r);
          const okGov = !myGov || !reqGov || myGov === reqGov || (dmRt !== null && dmRt <= 25000);
          if (!isMyBlk && ((r.request_mode === 'open' && okG && okGov && !blockedBySet.has(r.requester_user_id)) || r.nurse_user_id === user.id)) {
            S.playStrongRingtone();
          }
        }
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'care_direct_messages' }, (p) => {
        if (p.new && p.new.channel !== 'nurse') return;
        if (!$('chatModal').classList.contains('hidden')) loadChat();
      })
      .subscribe();
    }
    S.initNativeFcm(user.id, 'nurse');
    S.showActiveAnnouncement('nurse', user.id);
    connectNurseRt();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && nurseRt) { S.client.removeChannel(nurseRt); nurseRt = null; }
      else if (!document.hidden) { connectNurseRt(); loadRequests(); }
    });
  })();
})();
</script>
</body>
</html>
