<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CareGuard TN — بوابة الدخول</title>
  <meta name="theme-color" content="#0E5A3E" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-[#FAF6EE]/95 backdrop-blur border-b border-[#E8DFCE]">
  <div class="mx-auto flex max-w-md items-center justify-between px-4 py-3">
    <div class="flex items-center gap-2.5">
      <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-[#0E5A3E] text-white shadow-sm">
        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 14.35l-1.15-1.05C8.3 13.02 6.8 11.65 6.8 9.95c0-1.36 1.07-2.45 2.42-2.45.77 0 1.51.36 1.98.94.47-.58 1.21-.94 1.98-.94 1.35 0 2.42 1.09 2.42 2.45 0 1.7-1.5 3.07-4.05 5.35L12 16.35z"/>
        </svg>
      </div>
      <div>
        <h1 class="font-serif-brand text-2xl font-extrabold leading-none text-[#0E5A3E]">CareGuard TN</h1>
        <p id="gwSub" class="mt-0.5 text-[11px] font-bold text-[#5C6F63]">صحتك وسكينتك • v2.0-TN</p>
      </div>
    </div>
    <button id="langBtn" type="button" class="tap-btn rounded-full border border-[#E8DFCE] bg-[#FFFDF8] px-3.5 py-2 text-xs font-black text-[#0E5A3E] shadow-sm">FR</button>
  </div>
</header>

<main class="mx-auto w-full max-w-md flex-1 space-y-5 px-4 py-6">
  <!-- Step 1: Role Chooser -->
  <section id="roleSection" class="cg-card p-5 space-y-3.5">
    <div class="text-center space-y-1">
      <h2 id="roleTitle" class="text-xl font-black text-[#0E5A3E]">من يستخدم CareGuard TN؟</h2>
      <p id="roleSub" class="text-xs font-bold text-[#5C6F63]">اختر صفتك ليفتح لك الفضاء المستقل الخاص بك</p>
    </div>

    <button id="btnSenior" type="button" class="tap-btn flex w-full items-center justify-between rounded-2xl border-2 border-[#0E5A3E] bg-[#EFF7F1] px-4 py-4 text-start shadow-sm">
      <div>
        <p id="lblSeniorTitle" class="text-lg font-black text-[#0E5A3E]">👴 أنا كبير السنّ</p>
        <p id="lblSeniorSub" class="text-xs font-bold text-[#3C5044]">الأدوية، الطوارئ، طلب ممرض والرسائل</p>
      </div>
      <span class="text-2xl font-black text-[#0E5A3E]">›</span>
    </button>

    <button id="btnFamily" type="button" class="tap-btn flex w-full items-center justify-between rounded-2xl border-2 border-sky-200 bg-sky-50 px-4 py-3.5 text-start shadow-sm">
      <div>
        <p id="lblFamilyTitle" class="text-base font-black text-sky-950">👨‍👩‍👧 العائلة</p>
        <p id="lblFamilySub" class="text-xs font-bold text-sky-800">متابعة قريبك برمز الدعوة وطلب ممرض</p>
      </div>
      <span class="text-2xl font-black text-sky-700">›</span>
    </button>

    <button id="btnNurse" type="button" class="tap-btn flex w-full items-center justify-between rounded-2xl border-2 border-teal-200 bg-teal-50 px-4 py-3.5 text-start shadow-sm">
      <div>
        <p id="lblNurseTitle" class="text-base font-black text-teal-950">🩺 ممرض / ممرضة</p>
        <p id="lblNurseSub" class="text-xs font-bold text-teal-800">استقبال طلبات الزيارة والتوجيه عبر الخريطة</p>
      </div>
      <span class="text-2xl font-black text-teal-700">›</span>
    </button>
  </section>

  <!-- Step 2: Login Card (shown after choosing role if not signed in) -->
  <section id="authSection" class="hidden cg-card p-5 space-y-4">
    <div class="flex items-center justify-between">
      <div>
        <h2 id="authTitle" class="text-lg font-black text-[#0E5A3E]">تسجيل الدخول السريع</h2>
        <p id="authRoleBadge" class="text-xs font-bold text-[#5C6F63]"></p>
      </div>
      <button id="changeRoleBtn" type="button" class="rounded-xl border border-[#DFD5C5] bg-[#FAF6EE] px-3 py-1.5 text-xs font-black text-[#163024]">تغيير الدور</button>
    </div>

    <button id="googleBtn" type="button" class="tap-btn flex w-full items-center justify-center gap-3 rounded-2xl border-2 border-[#D8CEBE] bg-white px-4 py-3.5 text-base font-extrabold text-[#163024] shadow-sm">
      <svg class="h-6 w-6 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
      </svg>
      <span id="googleLbl">المتابعة باستخدام Google</span>
    </button>

    <details class="rounded-2xl border border-[#E6DCCB] bg-[#FAF6EE] p-3">
      <summary id="emailSummary" class="cursor-pointer text-xs font-extrabold text-[#3C5044]">أو الدخول بالبريد الإلكتروني</summary>
      <div class="mt-3 space-y-2.5">
        <input id="emailName" type="text" placeholder="الاسم الكامل (عند التسجيل)" class="w-full rounded-xl border border-[#D8CEBE] bg-white px-3.5 py-2.5 text-sm font-bold" />
        <input id="emailInput" type="email" dir="ltr" placeholder="name@example.com" class="w-full rounded-xl border border-[#D8CEBE] bg-white px-3.5 py-2.5 text-sm font-bold" />
        <input id="passInput" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" class="w-full rounded-xl border border-[#D8CEBE] bg-white px-3.5 py-2.5 text-sm font-bold" />
        <div class="grid grid-cols-2 gap-2">
          <button id="signInBtn" type="button" class="tap-btn rounded-xl bg-[#163024] px-3 py-2.5 text-sm font-black text-white">دخول</button>
          <button id="signUpBtn" type="button" class="tap-btn rounded-xl bg-[#0E5A3E] px-3 py-2.5 text-sm font-black text-white">حساب جديد</button>
        </div>
      </div>
    </details>
    <p id="authMsg" class="hidden rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-center text-xs font-extrabold text-rose-900"></p>
  </section>

  <p class="text-center text-xs font-bold text-[#5C6F63]">
    <a href="./privacy.html" class="underline text-[#0E5A3E]" id="privLink">سياسة الخصوصية والشروط</a>
  </p>
</main>

<script src="./shared.js"></script>
<script>
(function () {
  'use strict';
  const S = window.CG_SHARED;
  const $ = S.$;
  let pickedRole = S.getRole();

  function renderText() {
    const isFr = S.getLang() === 'fr';
    $('langBtn').textContent = isFr ? 'عربي' : 'FR';
    $('gwSub').textContent = (isFr ? 'Votre santé et sérénité • ' : 'صحتك وسكينتك • ') + S.CONFIG.VERSION;
    $('roleTitle').textContent = isFr ? 'Qui utilise CareGuard TN ?' : 'من يستخدم CareGuard TN؟';
    $('roleSub').textContent = isFr ? 'Choisissez votre espace indépendant' : 'اختر صفتك ليفتح لك الفضاء المستقل الخاص بك';
    $('lblSeniorTitle').textContent = isFr ? '👴 Je suis Senior' : '👴 أنا كبير السنّ';
    $('lblSeniorSub').textContent = isFr ? 'Médicaments, urgences, infirmier et messages' : 'الأدوية، الطوارئ، طلب ممرض والرسائل';
    $('lblFamilyTitle').textContent = isFr ? '👨‍👩‍👧 Famille' : '👨‍👩‍👧 العائلة';
    $('lblFamilySub').textContent = isFr ? 'Suivre un proche par code et demander un infirmier' : 'متابعة قريبك برمز الدعوة وطلب ممرض';
    $('lblNurseTitle').textContent = isFr ? '🩺 Infirmier / Infirmière' : '🩺 ممرض / ممرضة';
    $('lblNurseSub').textContent = isFr ? 'Demandes de visite et itinéraire Google Maps' : 'استقبال طلبات الزيارة والتوجيه عبر الخريطة';
    $('authTitle').textContent = isFr ? 'Connexion rapide' : 'تسجيل الدخول السريع';
    $('changeRoleBtn').textContent = isFr ? 'Changer' : 'تغيير الدور';
    $('googleLbl').textContent = isFr ? 'Continuer avec Google' : 'المتابعة باستخدام Google';
    $('emailSummary').textContent = isFr ? 'Ou se connecter par e-mail' : 'أو الدخول بالبريد الإلكتروني';
    $('signInBtn').textContent = isFr ? 'Connexion' : 'دخول';
    $('signUpBtn').textContent = isFr ? 'Créer' : 'حساب جديد';
    $('privLink').textContent = isFr ? 'Confidentialité & Conditions' : 'سياسة الخصوصية والشروط';
    const roleLabels = {
      senior: isFr ? 'Espace Senior' : 'فضاء كبير السنّ',
      family: isFr ? 'Espace Famille' : 'فضاء العائلة',
      nurse: isFr ? 'Espace Infirmier(ère)' : 'فضاء الممرض / الممرضة'
    };
    $('authRoleBadge').textContent = roleLabels[pickedRole] || '';
  }

  function showErr(msg) {
    const el = $('authMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  async function selectRole(role) {
    pickedRole = role;
    S.setRole(role);
    renderText();
    const user = await S.getSessionUser();
    if (user) {
      window.location.href = S.rolePageUrl(role);
      return;
    }
    $('roleSection').classList.add('hidden');
    $('authSection').classList.remove('hidden');
  }

  $('btnSenior').addEventListener('click', () => selectRole('senior'));
  $('btnFamily').addEventListener('click', () => selectRole('family'));
  $('btnNurse').addEventListener('click', () => selectRole('nurse'));
  $('changeRoleBtn').addEventListener('click', () => {
    $('authSection').classList.add('hidden');
    $('roleSection').classList.remove('hidden');
  });
  $('langBtn').addEventListener('click', () => {
    S.setLang(S.getLang() === 'fr' ? 'ar' : 'fr');
    renderText();
  });

  $('googleBtn').addEventListener('click', async () => {
    if (!S.client) return;
    const redirectTo = window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + S.rolePageUrl(pickedRole || 'senior').replace('./', '');
    const { error } = await S.client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo, queryParams: { prompt: 'select_account' } }
    });
    if (error) showErr(error.message);
  });

  $('signInBtn').addEventListener('click', async () => {
    const email = $('emailInput').value.trim(), password = $('passInput').value;
    if (!email || password.length < 6) return showErr(S.getLang() === 'fr' ? 'E-mail et mot de passe (6+ car.) requis.' : 'أدخل البريد الإلكتروني وكلمة مرور (6 أحرف على الأقل).');
    const { error } = await S.client.auth.signInWithPassword({ email, password });
    if (error) return showErr(error.message);
    window.location.href = S.rolePageUrl(pickedRole || 'senior');
  });

  $('signUpBtn').addEventListener('click', async () => {
    const email = $('emailInput').value.trim(), password = $('passInput').value, name = $('emailName').value.trim();
    if (!email || password.length < 6) return showErr(S.getLang() === 'fr' ? 'E-mail et mot de passe (6+ car.) requis.' : 'أدخل البريد الإلكتروني وكلمة مرور (6 أحرف على الأقل).');
    const { data, error } = await S.client.auth.signUp({ email, password, options: { data: { display_name: name || email.split('@')[0] } } });
    if (error) return showErr(error.message);
    if (data && data.session) window.location.href = S.rolePageUrl(pickedRole || 'senior');
    else showErr(S.getLang() === 'fr' ? 'Vérifiez votre boîte e-mail pour confirmer.' : 'تم إنشاء الحساب — تحقق من بريدك الإلكتروني للتأكيد.');
  });

  renderText();
  // Auto-redirect if already logged in with a saved role (unless ?choose=1)
  if (!new URLSearchParams(window.location.search).get('choose')) {
    S.getSessionUser().then((u) => {
      if (u && pickedRole) window.location.href = S.rolePageUrl(pickedRole);
    });
  }
})();
</script>
</body>
</html>
