<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoinsDar — لوحة الإدارة</title>
  <meta name="theme-color" content="#0A4D68" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen pb-16">

<header class="sticky top-0 z-30 bg-[#F2F8FF]/95 backdrop-blur border-b border-[#CFE3F5]">
  <div class="mx-auto flex max-w-2xl items-center justify-between gap-2 px-4 py-3">
    <div class="flex items-center gap-2.5">
<img src="./emblem-soinsdar.png" alt="SOINSDAR" class="h-11 w-auto shrink-0 object-contain" />
      <div>
        <h1 class="font-serif-brand text-xl font-extrabold leading-none text-[#0A4D68]">لوحة الإدارة</h1>
        <p class="mt-0.5 text-[11px] font-bold text-[#4A657A]">SoinsDar • مراقبة شاملة</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="admRefreshBtn" type="button" class="tap-btn rounded-xl border border-[#C2DBF0] bg-white px-3 py-1.5 text-xs font-black text-[#0A4D68]">🔄 تحديث</button>
      <a href="./index.html?choose=1" class="tap-btn inline-flex items-center rounded-xl bg-[#0A4D68] px-3 py-1.5 text-xs font-black text-white">الرئيسية</a>
    </div>
  </div>
</header>

<main class="mx-auto max-w-2xl space-y-4 px-4 pt-4">
  <div id="admGuardBox" class="hidden cg-card p-6 text-center space-y-3">
    <p class="text-base font-black text-rose-800">🔒 هذه الصفحة مخصصة لإدارة التطبيق فقط.</p>
    <p id="admGuardEmail" class="text-xs font-bold text-[#4A657A]"></p>
    <a href="./index.html?choose=1" class="inline-block rounded-xl bg-[#0A4D68] px-5 py-2.5 text-xs font-black text-white">العودة للبوابة</a>
  </div>

  <div id="admContentWrap" class="hidden space-y-4">
    <!-- KPI Summary -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
      <div class="cg-card p-3 text-center">
        <div id="kpiSeniors" class="text-xl font-black text-[#0A4D68]">0</div>
        <div class="text-[11px] font-extrabold text-[#4A657A]">👴 المسنّون</div>
      </div>
      <div class="cg-card p-3 text-center">
        <div id="kpiNurses" class="text-xl font-black text-teal-800">0</div>
        <div class="text-[11px] font-extrabold text-[#4A657A]">🩺 الممرضون</div>
      </div>
      <div class="cg-card p-3 text-center">
        <div id="kpiReqs" class="text-xl font-black text-indigo-800">0</div>
        <div class="text-[11px] font-extrabold text-[#4A657A]">📋 الطلبات</div>
      </div>
      <div class="cg-card p-3 text-center">
        <div id="kpiAlerts" class="text-xl font-black text-rose-700">0</div>
        <div class="text-[11px] font-extrabold text-[#4A657A]">🚨 تنبيهات مفتوحة</div>
      </div>
    </div>

    <!-- 6 Subtabs -->
    <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 rounded-2xl bg-[#E3EFFB] p-1.5">
      <button type="button" data-adm-tab="nurses" class="rounded-xl bg-[#0A4D68] text-white py-2 text-xs font-black">🩺 الممرضون</button>
      <button type="button" data-adm-tab="seniors" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">👴 المسنّون</button>
      <button type="button" data-adm-tab="families" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">👨‍👩‍👧 العائلات</button>
      <button type="button" data-adm-tab="requests" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">📋 الطلبات</button>
      <button type="button" data-adm-tab="reviews" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">⭐ التقييمات</button>
      <button type="button" data-adm-tab="alerts" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">🚨 التنبيهات</button>
      <button type="button" data-adm-tab="feedback" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">📩 البلاغات</button>
      <button type="button" data-adm-tab="announcements" class="rounded-xl text-[#334E63] py-2 text-xs font-extrabold">📢 الإعلانات</button>
    </div>

    <div id="admToast" class="hidden rounded-2xl border border-emerald-300 bg-emerald-50 px-3 py-2 text-center text-xs font-black text-[#0A4D68]"></div>
    <div class="flex items-center gap-2">
      <input id="admSearchInp" type="search" placeholder="🔍 ابحث بالاسم، رقم الهاتف، الولاية، أو الرمز (CG-)..." class="w-full rounded-2xl border border-[#C2DBF0] bg-white px-3.5 py-2.5 text-xs font-bold text-[#0B2538] shadow-sm" />
    </div>
    <div id="admList" class="space-y-2.5"></div>
  </div>
</main>

<script src="./shared.js"></script>
<script>
(function () {
  'use strict';
  const S = window.CG_SHARED;
  const $ = S.$;
  let user = null;
  let activeTab = 'nurses';
  let dataState = { seniors: [], families: [], nurses: [], reqs: [], reviews: [], alerts: [], feedback: [], announcements: [] };

  function showMsg(txt) {
    const el = $('admToast');
    el.textContent = txt;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString('ar-TN', { year: 'numeric', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (_) { return String(iso); }
  }

  async function loadAll() {
    $('admList').textContent = '⏳ جاري تحميل البيانات...';
    const [sRes, fRes, nRes, rRes, revRes, alRes, fbRes, annRes] = await Promise.all([
      S.client.from('senior_profiles').select('id, display_name, registration_number, senior_phone, emergency_phone, blood_type, allergies, conditions, home_address, home_lat, home_lng, created_at').order('created_at', { ascending: false }).limit(200),
      S.client.from('senior_care_links').select('id, senior_id, requester_user_id, requester_name, requester_phone, role_type, status, created_at, senior_profiles(display_name, senior_phone, emergency_phone, home_address, home_lat, home_lng)').eq('role_type', 'family').order('created_at', { ascending: false }).limit(200),
      S.client.from('nurse_profiles').select('*').order('created_at', { ascending: false }).limit(200),
      S.client.from('nurse_visit_requests').select('*').order('created_at', { ascending: false }).limit(120),
      S.client.from('nurse_reviews').select('*').order('created_at', { ascending: false }).limit(100),
      S.client.from('alerts').select('*').order('created_at', { ascending: false }).limit(100),
      S.client.from('app_feedback').select('*').order('created_at', { ascending: false }).limit(80),
      S.client.from('app_announcements').select('*').order('created_at', { ascending: false }).limit(50)
    ]);
    dataState.seniors = (!sRes.error && sRes.data) || [];
    dataState.families = (!fRes.error && fRes.data) || [];
    dataState.nurses = (!nRes.error && nRes.data) || [];
    dataState.reqs = (!rRes.error && rRes.data) || [];
    dataState.reviews = (!revRes.error && revRes.data) || [];
    dataState.alerts = (!alRes.error && alRes.data) || [];
    dataState.feedback = (!fbRes.error && fbRes.data) || [];
    dataState.announcements = (!annRes.error && annRes.data) || [];

    $('kpiSeniors').textContent = String(dataState.seniors.length);
    $('kpiNurses').textContent = String(dataState.nurses.length);
    $('kpiReqs').textContent = String(dataState.reqs.length);
    $('kpiAlerts').textContent = String(dataState.alerts.filter((a) => a.status === 'open').length);
    renderTab();
  }

  function openSubscriberModal(title, rowsList) {
    const existing = $('admSubDetailModal');
    if (existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'admSubDetailModal';
    wrap.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4';
    const card = document.createElement('div');
    card.className = 'w-full max-w-md max-h-[88vh] overflow-y-auto rounded-[28px] border border-[#CFE3F5] bg-white p-5 shadow-2xl space-y-3';
    const hdr = document.createElement('div');
    hdr.className = 'flex items-center justify-between border-b border-[#DCEBF8] pb-2.5';
    const h = document.createElement('h3');
    h.className = 'text-base font-black text-[#0A4D68]';
    h.textContent = title;
    const cls = document.createElement('button');
    cls.type = 'button'; cls.className = 'rounded-xl px-2.5 py-1 text-lg font-black text-slate-500'; cls.textContent = '✕';
    cls.addEventListener('click', () => wrap.remove());
    hdr.append(h, cls);

    const list = document.createElement('div');
    list.className = 'space-y-2';
    const copyLines = [title];
    rowsList.forEach(([k, v]) => {
      const val = v ? String(v) : '—';
      copyLines.push(`${k}: ${val}`);
      const item = document.createElement('div');
      item.className = 'rounded-xl bg-[#F2F8FF] px-3 py-2 text-xs';
      const kl = document.createElement('p'); kl.className = 'font-black text-[#4A657A] text-[10px]'; kl.textContent = k;
      const vl = document.createElement('p'); vl.className = 'font-black text-[#0B2538] break-words'; vl.textContent = val;
      item.append(kl, vl);
      list.appendChild(item);
    });

    const act = document.createElement('div');
    act.className = 'flex gap-2 pt-1';
    const cpBtn = document.createElement('button');
    cpBtn.type = 'button';
    cpBtn.className = 'tap-btn flex-1 rounded-xl bg-[#0A4D68] px-3 py-2.5 text-xs font-black text-white';
    cpBtn.textContent = '📋 نسخ كل البيانات';
    cpBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(copyLines.join('\n')); showMsg('✓ تم نسخ كافة البيانات'); } catch (_) { showMsg('⚠️ تعذر النسخ التلقائي'); }
    });
    act.appendChild(cpBtn);
    const phoneRow = rowsList.find(([k, v]) => /الهاتف|طوارئ/.test(k) && v && /\d{6,}/.test(String(v)));
    if (phoneRow && S.safeTelHref && S.safeTelHref(phoneRow[1])) {
      const ca = document.createElement('a');
      ca.href = S.safeTelHref(phoneRow[1]);
      ca.className = 'tap-btn rounded-xl border border-emerald-400 bg-emerald-50 px-4 py-2.5 text-xs font-black text-[#0A4D68]';
      ca.textContent = '📞 اتصال';
      act.appendChild(ca);
    }
    card.append(hdr, list, act);
    wrap.appendChild(card);
    document.body.appendChild(wrap);
  }

  function matchSearch(parts) {
    const q = ($('admSearchInp') && $('admSearchInp').value || '').trim().toLowerCase();
    if (!q) return true;
    return parts.filter(Boolean).join(' ').toLowerCase().includes(q);
  }

  function renderTab() {
    document.querySelectorAll('[data-adm-tab]').forEach((b) => {
      const on = b.dataset.admTab === activeTab;
      b.className = on ? 'rounded-xl bg-[#0A4D68] text-white py-2 text-xs font-black' : 'rounded-xl text-[#334E63] py-2 text-xs font-extrabold';
    });

    const box = $('admList');
    box.replaceChildren();

    if (activeTab === 'nurses') {
      if (!dataState.nurses.length) { box.textContent = 'لا يوجد ممرضون مسجّلون بعد.'; return; }
      dataState.nurses.filter((n) => matchSearch([n.full_name, n.phone, n.region, n.city_zip, n.city, n.credential, n.specialties])).forEach((n) => {
        const isBan = !!n.is_banned;
        const isVer = n.verification_status === 'verified';
        const isSusp = !!(n.suspended_until && new Date(n.suspended_until).getTime() > Date.now());
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-2 ' + (isBan ? 'border-rose-300 bg-rose-50/40' : '');
        const top = document.createElement('div');
        top.className = 'flex items-center justify-between gap-2';
        const nm = document.createElement('p');
        nm.className = 'text-sm font-black text-[#0B2538]';
        nm.textContent = `🩺 ${n.full_name || 'ممرض'} (${n.credential || 'IDE'})`;
        const bdg = document.createElement('span');
        bdg.className = isBan ? 'rounded-full bg-rose-600 px-2.5 py-0.5 text-[10px] font-black text-white' : (isSusp ? 'rounded-full bg-amber-500 px-2.5 py-0.5 text-[10px] font-black text-white' : (isVer ? 'rounded-full bg-emerald-100 px-2.5 py-0.5 text-[10px] font-black text-[#0A4D68]' : 'rounded-full bg-slate-200 px-2.5 py-0.5 text-[10px] font-black text-slate-700'));
        bdg.textContent = isBan ? 'محظور' : (isSusp ? 'معلّق' : (isVer ? '✓ موثّق' : 'قيد المراجعة'));
        top.append(nm, bdg);
        const nrGovRaw = n.region || ((n.base_lat && n.base_lng) ? S.detectTnGovernorate(n.base_lat, n.base_lng) : '');
        const nrGov = nrGovRaw ? S.formatGovLabel(nrGovRaw) : '—';
        const nrAddr = n.city_zip || n.city || '—';
        const meta = document.createElement('p');
        meta.className = 'text-xs font-bold text-[#4A657A] leading-relaxed';
        meta.textContent = `🏛️ الولاية: ${nrGov} • 📍 العنوان: ${nrAddr} • 📞 ${n.phone || '—'}\n📅 تاريخ إنشاء الحساب: ${fmtDate(n.created_at)}`;
        meta.classList.add('whitespace-pre-line');
        const docsRow = document.createElement('div');
        docsRow.className = 'flex flex-wrap gap-1.5';
        [['doc_cin_url', '🪪 بطاقة التعريف'], ['doc_diploma_url', '🎓 الشهادة'], ['doc_license_url', '📄 شهادة عمل']].forEach(([col, lbl]) => {
          if (!n[col]) return;
          const db = document.createElement('button');
          db.type = 'button';
          db.className = 'rounded-xl border border-[#B6D8F2] bg-[#E8F4FD] px-2.5 py-1 text-[11px] font-black text-[#0A4D68]';
          db.textContent = lbl;
          db.addEventListener('click', () => {
            const ov = document.createElement('div');
            ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-slate-900/85 p-4';
            const im = document.createElement('img');
            im.src = n[col];
            im.className = 'max-h-[85vh] max-w-full rounded-2xl shadow-2xl bg-white';
            ov.appendChild(im);
            ov.addEventListener('click', () => ov.remove());
            document.body.appendChild(ov);
          });
          docsRow.appendChild(db);
        });
        if (docsRow.childNodes.length) c.appendChild(docsRow);
        const row = document.createElement('div');
        row.className = 'flex flex-wrap gap-1.5 pt-1';

        const bVer = document.createElement('button');
        bVer.type = 'button';
        bVer.className = 'rounded-xl bg-[#0A4D68] px-2.5 py-1.5 text-[11px] font-black text-white';
        bVer.textContent = isVer ? 'إلغاء التوثيق' : '🏅 توثيق';
        bVer.addEventListener('click', async () => {
          const next = isVer ? 'pending' : 'verified';
          await S.client.from('nurse_profiles').update({ verification_status: next }).eq('user_id', n.user_id);
          n.verification_status = next; renderTab(); showMsg('✓ تم تحديث حالة التوثيق');
        });

        const bSusp = document.createElement('button');
        bSusp.type = 'button';
        bSusp.className = 'rounded-xl bg-amber-100 px-2.5 py-1.5 text-[11px] font-black text-amber-950';
        bSusp.textContent = isSusp ? 'رفع التعليق' : '⏸️ تعليق أسبوع';
        bSusp.addEventListener('click', async () => {
          const until = isSusp ? null : new Date(Date.now() + 7 * 86400000).toISOString();
          await S.client.from('nurse_profiles').update({ suspended_until: until }).eq('user_id', n.user_id);
          n.suspended_until = until; renderTab(); showMsg(until ? '⏸️ تم تعليق الممرض أسبوعاً' : '✓ تم رفع التعليق');
        });

        const bBan = document.createElement('button');
        bBan.type = 'button';
        bBan.className = 'rounded-xl bg-rose-100 px-2.5 py-1.5 text-[11px] font-black text-rose-900';
        bBan.textContent = isBan ? 'فك الحظر' : '🚫 حظر';
        bBan.addEventListener('click', async () => {
          await S.client.from('nurse_profiles').update({ is_banned: !isBan }).eq('user_id', n.user_id);
          n.is_banned = !isBan; renderTab(); showMsg(!isBan ? '🚫 تم حظر الممرض' : '✓ تم فك الحظر');
        });

        const bDel = document.createElement('button');
        bDel.type = 'button';
        bDel.className = 'rounded-xl border border-rose-200 bg-white px-2.5 py-1.5 text-[11px] font-black text-rose-800';
        bDel.textContent = '🗑️ مسح';
        bDel.addEventListener('click', async () => {
          if (!confirm(`مسح ملف الممرض «${n.full_name || ''}» دون حظره؟`)) return;
          const { error } = await S.client.from('nurse_profiles').delete().eq('user_id', n.user_id);
          if (error) return alert('⚠️ ' + error.message);
          dataState.nurses = dataState.nurses.filter((x) => x.user_id !== n.user_id);
          $('kpiNurses').textContent = String(dataState.nurses.length);
          renderTab(); showMsg('🗑️ تم مسح الممرض دون حظره');
        });
        const bDet = document.createElement('button');
        bDet.type = 'button';
        bDet.className = 'rounded-xl border border-[#B6D8F2] bg-[#E8F4FD] px-2.5 py-1.5 text-[11px] font-black text-[#0A4D68]';
        bDet.textContent = '📋 البيانات';
        bDet.addEventListener('click', () => openSubscriberModal(`🩺 بيانات الممرض: ${n.full_name || ''}`, [
          ['الاسم الكامل', n.full_name],
          ['رقم الهاتف', n.phone],
          ['الرتبة', n.credential],
          ['الولاية', nrGov],
          ['العنوان / المعتمدية', nrAddr],
          ['سنوات الخبرة', n.years_exp],
          ['التخصصات', n.specialties],
          ['اللغات', n.languages],
          ['الحالة', isBan ? 'محظور' : (isSusp ? 'معلّق' : (isVer ? 'موثّق' : 'قيد المراجعة'))],
          ['موقع GPS', (n.base_lat && n.base_lng) ? `https://maps.google.com/?q=${n.base_lat},${n.base_lng}` : 'غير محدد'],
          ['تاريخ التسجيل', fmtDate(n.created_at)]
        ]));
        row.append(bDet, bVer, bSusp, bBan, bDel);
        c.append(top, meta, row);
        box.appendChild(c);
      });
      return;
    }

    if (activeTab === 'requests') {
      if (!dataState.reqs.length) { box.textContent = 'لا توجد طلبات زيارة بعد.'; return; }
      dataState.reqs.forEach((r) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-1.5 ' + (r.discrepancy_flag ? 'border-rose-400 bg-rose-50/40' : '');
        const top = document.createElement('div');
        top.className = 'flex items-center justify-between gap-2 text-xs font-black';
        const s1 = document.createElement('span');
        s1.textContent = `📋 ${r.requester_name || 'مريض'} ← ${r.accepted_by_name || r.nurse_name || 'مفتوح'}`;
        const s2 = document.createElement('span');
        s2.className = 'rounded-full bg-slate-100 px-2 py-0.5 text-[10px]';
        s2.textContent = r.status;
        top.append(s1, s2);
        const p = document.createElement('p');
        p.className = 'text-[11px] font-bold text-[#4A657A]';
        p.textContent = `${r.care_reason || ''} • ${S.formatGovLabel(r.region) || ''} • ${fmtDate(r.created_at)}` + (r.discrepancy_flag ? ' • ⚠️ تعارض نتيجة' : '');
        c.append(top, p);
        if (r.status === 'open' || r.status === 'pending' || r.status === 'accepted') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'rounded-xl bg-rose-100 px-3 py-1 text-[11px] font-black text-rose-900';
          btn.textContent = '✕ إغلاق الطلب';
          btn.addEventListener('click', async () => {
            await S.client.from('nurse_visit_requests').update({ status: 'declined' }).eq('id', r.id);
            r.status = 'declined'; renderTab(); showMsg('✓ تم إغلاق الطلب');
          });
          c.appendChild(btn);
        }
        box.appendChild(c);
      });
      return;
    }

    if (activeTab === 'reviews') {
      if (!dataState.reviews.length) { box.textContent = 'لا توجد تقييمات أو شكاوى بعد.'; return; }
      dataState.reviews.forEach((rv) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-1.5 ' + (rv.is_complaint ? 'border-rose-300 bg-rose-50/40' : '');
        const p1 = document.createElement('p');
        p1.className = 'text-xs font-black text-[#0B2538]';
        p1.textContent = `${'⭐'.repeat(Math.max(1, Math.min(5, rv.rating || 5)))} — ${rv.reviewer_name || 'مستخدم'} ${rv.is_complaint ? '• ⚠️ شكوى' : ''}`;
        const p2 = document.createElement('p');
        p2.className = 'text-xs font-bold text-[#4A657A]';
        p2.textContent = (rv.comment || 'بدون تعليق') + ' • ' + fmtDate(rv.created_at);
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'rounded-xl bg-rose-100 px-2.5 py-1 text-[11px] font-black text-rose-900';
        del.textContent = '🗑️ حذف التقييم';
        del.addEventListener('click', async () => {
          await S.client.from('nurse_reviews').delete().eq('id', rv.id);
          dataState.reviews = dataState.reviews.filter((x) => x.id !== rv.id);
          renderTab(); showMsg('🗑️ تم حذف التقييم');
        });
        c.append(p1, p2, del);
        box.appendChild(c);
      });
      return;
    }

    if (activeTab === 'seniors') {
      if (!dataState.seniors.length) { box.textContent = 'لا يوجد مسنّون مسجّلون بعد.'; return; }
      dataState.seniors.filter((sp) => matchSearch([sp.display_name, sp.senior_phone, sp.emergency_phone, sp.registration_number, sp.home_address, sp.conditions, sp.allergies])).forEach((sp) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 flex items-center justify-between gap-2';
        const d = document.createElement('div');
        d.className = 'min-w-0 flex-1';
        const p1 = document.createElement('p');
        p1.className = 'text-sm font-black text-[#0B2538] truncate';
        p1.textContent = `👴 ${sp.display_name || 'مسنّ'}`;
        const p2 = document.createElement('p');
        p2.className = 'text-[11px] font-bold text-[#4A657A] break-words';
        const srGovRaw = (sp.home_lat && sp.home_lng) ? S.detectTnGovernorate(sp.home_lat, sp.home_lng) : '';
        const srGov = srGovRaw ? S.formatGovLabel(srGovRaw) : '—';
        p2.classList.add('whitespace-pre-line', 'leading-relaxed');
        p2.textContent = `🔑 ${sp.registration_number || '—'} • 📞 ${sp.senior_phone || '—'}\n🏛️ الولاية: ${srGov} • 📍 العنوان: ${sp.home_address || '—'}\n📅 تاريخ إنشاء الحساب: ${fmtDate(sp.created_at)}`;
        d.append(p1, p2);
        const bDel = document.createElement('button');
        bDel.type = 'button';
        bDel.className = 'shrink-0 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[11px] font-black text-rose-800';
        bDel.textContent = '🗑️ مسح';
        bDel.addEventListener('click', async () => {
          if (!confirm(`مسح ملف المسنّ «${sp.display_name || ''}» دون حظره؟`)) return;
          const { error } = await S.client.from('senior_profiles').delete().eq('id', sp.id);
          if (error) return alert('⚠️ ' + error.message);
          dataState.seniors = dataState.seniors.filter((x) => x.id !== sp.id);
          dataState.families = dataState.families.filter((f) => f.senior_id !== sp.id);
          $('kpiSeniors').textContent = String(dataState.seniors.length);
          renderTab(); showMsg('🗑️ تم مسح ملف المسنّ');
        });
        const bDet = document.createElement('button');
        bDet.type = 'button';
        bDet.className = 'rounded-xl border border-[#B6D8F2] bg-[#E8F4FD] px-3 py-1 text-[11px] font-black text-[#0A4D68] shrink-0';
        bDet.textContent = '📋 البيانات';
        bDet.addEventListener('click', () => openSubscriberModal(`👴 بيانات المسنّ: ${sp.display_name || ''}`, [
          ['الاسم', sp.display_name],
          ['الرمز', sp.registration_number],
          ['هاتف المسنّ', sp.senior_phone],
          ['رقم الطوارئ (العائلة)', sp.emergency_phone],
          ['فصيلة الدم', sp.blood_type],
          ['الحساسية', sp.allergies],
          ['الأمراض المزمنة', sp.conditions],
          ['الولاية', sGov],
          ['موقع GPS', (sp.home_lat && sp.home_lng) ? `https://maps.google.com/?q=${sp.home_lat},${sp.home_lng}` : 'غير محدد'],
          ['تاريخ التسجيل', fmtDate(sp.created_at)]
        ]));
        c.append(d, bDet, bDel);
        box.appendChild(c);
      });
      return;
    }

    if (activeTab === 'families') {
      if (!dataState.families.length) { box.textContent = 'لا توجد حسابات عائلات مرتبطة بعد.'; return; }
      dataState.families.filter((f) => matchSearch([f.requester_name, f.requester_phone, f.senior_profiles && f.senior_profiles.display_name, f.senior_profiles && f.senior_profiles.emergency_phone])).forEach((f) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 flex items-center justify-between gap-2';
        const d = document.createElement('div');
        d.className = 'min-w-0 flex-1';
        const p1 = document.createElement('p');
        p1.className = 'text-sm font-black text-[#0B2538] truncate';
        p1.textContent = `👨‍👩‍👧 ${f.requester_name || 'قريب / عائلة'}`;
        const p2 = document.createElement('p');
        p2.className = 'text-[11px] font-bold text-[#4A657A]';
        const spf = f.senior_profiles || {};
        const senName = spf.display_name || '—';
        const fmGovRaw = (spf.home_lat && spf.home_lng) ? S.detectTnGovernorate(spf.home_lat, spf.home_lng) : '';
        const fmGov = fmGovRaw ? S.formatGovLabel(fmGovRaw) : '—';
        p2.classList.add('whitespace-pre-line', 'leading-relaxed');
        p2.textContent = `مرتبط بـ: ${senName} • الحالة: ${f.status}\n🏛️ الولاية: ${fmGov} • 📍 العنوان: ${spf.home_address || '—'}\n📅 تاريخ إنشاء الحساب: ${fmtDate(f.created_at)}`;
        d.append(p1, p2);
        const bDel = document.createElement('button');
        bDel.type = 'button';
        bDel.className = 'shrink-0 rounded-xl border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-[11px] font-black text-rose-800';
        bDel.textContent = '🗑️ مسح';
        bDel.addEventListener('click', async () => {
          if (!confirm(`مسح ربط العائلة «${f.requester_name || ''}» دون حظرها؟`)) return;
          const { error } = await S.client.from('senior_care_links').delete().eq('id', f.id);
          if (error) return alert('⚠️ ' + error.message);
          dataState.families = dataState.families.filter((x) => x.id !== f.id);
          renderTab(); showMsg('🗑️ تم مسح العائلة من القائمة');
        });
        const famPh = f.requester_phone || (f.senior_profiles && f.senior_profiles.emergency_phone) || '';
        const bDet = document.createElement('button');
        bDet.type = 'button';
        bDet.className = 'rounded-xl border border-[#B6D8F2] bg-[#E8F4FD] px-3 py-1 text-[11px] font-black text-[#0A4D68] shrink-0';
        bDet.textContent = '📋 البيانات';
        bDet.addEventListener('click', () => openSubscriberModal(`👨‍👩‍👧 بيانات العائلة: ${f.requester_name || ''}`, [
          ['الاسم / القرابة', f.requester_name],
          ['رقم هاتف العائلة', famPh],
          ['المسنّ المرتبط', f.senior_profiles && f.senior_profiles.display_name],
          ['هاتف المسنّ', f.senior_profiles && f.senior_profiles.senior_phone],
          ['الولاية', fGov],
          ['الحالة', f.status],
          ['تاريخ التسجيل', fmtDate(f.created_at)]
        ]));
        c.append(d, bDet, bDel);
        box.appendChild(c);
      });
      return;
    }

    if (activeTab === 'feedback') {
      if (!dataState.feedback.length) {
        const em = document.createElement('div');
        em.className = 'cg-card p-5 text-center text-xs font-bold text-[#4A657A]';
        em.textContent = 'لا توجد رسائل أو بلاغات مستخدمين حالياً.';
        box.appendChild(em);
      }
      dataState.feedback.forEach((f) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-2 text-xs';
        const hdr = document.createElement('div');
        hdr.className = 'flex items-center justify-between gap-2';
        const nm = document.createElement('p');
        nm.className = 'font-black text-[#0A4D68]';
        nm.textContent = `[${f.category || 'message'}] ${f.user_name || 'مستخدم'} (${f.user_role || ''})`;
        const tm = document.createElement('span');
        tm.className = 'text-[10px] font-bold text-[#4A657A]';
        tm.textContent = f.created_at ? new Date(f.created_at).toLocaleString('ar-TN') : '';
        hdr.append(nm, tm);
        const msg = document.createElement('p');
        msg.className = 'font-bold text-[#0B2538] whitespace-pre-line';
        msg.textContent = f.message || '';
        const act = document.createElement('div');
        act.className = 'flex items-center justify-between';
        const st = document.createElement('span');
        st.className = 'font-black ' + (f.status === 'resolved' ? 'text-emerald-700' : 'text-amber-700');
        st.textContent = f.status === 'resolved' ? '✓ تمت المعالجة' : '⏳ قيد المراجعة';
        act.appendChild(st);
        if (f.status !== 'resolved') {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'rounded-xl bg-[#0A4D68] px-3 py-1 text-[11px] font-black text-white';
          btn.textContent = '✓ إغلاق البلاغ';
          btn.addEventListener('click', async () => {
            await S.client.from('app_feedback').update({ status: 'resolved' }).eq('id', f.id);
            await loadAll();
          });
          act.appendChild(btn);
        }
        c.append(hdr, msg, act);
        box.appendChild(c);
      });
      return;
    }
    if (activeTab === 'announcements') {
      const form = document.createElement('div');
      form.className = 'cg-card p-4 space-y-2.5 border-2 border-[#B6D8F2]';
      const fh = document.createElement('h3');
      fh.className = 'text-sm font-black text-[#0A4D68]';
      fh.textContent = '📢 نشر إعلان عام (يظهر كنافذة عائمة عند فتح التطبيق)';
      const tInp = document.createElement('input');
      tInp.type = 'text';
      tInp.placeholder = 'عنوان الإعلان (مثلاً: تحديث جديد للتطبيق) *';
      tInp.className = 'w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2 text-xs font-bold';
      const roleSel = document.createElement('select');
      roleSel.className = 'w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2 text-xs font-bold';
      [['all', 'الجميع (المسنّون + العائلات + الممرضون)'], ['senior', 'المسنّون فقط'], ['family', 'العائلات فقط'], ['nurse', 'الممرضون فقط']].forEach(([v, l]) => {
        const o = document.createElement('option'); o.value = v; o.textContent = l; roleSel.appendChild(o);
      });
      const bInp = document.createElement('textarea');
      bInp.rows = 3;
      bInp.placeholder = 'نص الإعلان الذي سيظهر للمستخدمين... *';
      bInp.className = 'w-full rounded-xl border border-[#C2DBF0] bg-white px-3 py-2 text-xs font-bold';
      const pubBtn = document.createElement('button');
      pubBtn.type = 'button';
      pubBtn.className = 'tap-btn w-full rounded-xl bg-[#0A4D68] px-4 py-2.5 text-xs font-black text-white';
      pubBtn.textContent = '📢 نشر الإعلان العائم الآن';
      pubBtn.addEventListener('click', async () => {
        const title = tInp.value.trim(), message = bInp.value.trim();
        if (!title || !message) { showMsg('⚠️ أدخل العنوان ونص الإعلان'); return; }
        pubBtn.disabled = true;
        const { error } = await S.client.from('app_announcements').insert({
          title, message, target_role: roleSel.value, is_active: true, created_by: user ? user.id : null
        });
        pubBtn.disabled = false;
        if (error) { showMsg('⚠️ ' + error.message); return; }
        showMsg('✓ تم نشر الإعلان وسيظهر للمستخدمين عند فتح التطبيق');
        await loadAll();
      });
      form.append(fh, tInp, roleSel, bInp, pubBtn);
      box.appendChild(form);

      if (!dataState.announcements.length) {
        const emp = document.createElement('p');
        emp.className = 'text-center text-xs font-bold text-[#4A657A] py-3';
        emp.textContent = 'لا توجد إعلانات منشورة بعد.';
        box.appendChild(emp);
        return;
      }
      const roleLbl = { all: 'الجميع', senior: 'المسنّون', family: 'العائلات', nurse: 'الممرضون' };
      dataState.announcements.forEach((ann) => {
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-2 ' + (ann.is_active ? 'border-emerald-300' : 'opacity-70');
        const h = document.createElement('div');
        h.className = 'flex items-center justify-between gap-2';
        const tt = document.createElement('p'); tt.className = 'text-xs font-black text-[#0B2538]'; tt.textContent = ann.title;
        const bg = document.createElement('span');
        bg.className = 'rounded-full px-2 py-0.5 text-[10px] font-black ' + (ann.is_active ? 'bg-emerald-100 text-emerald-900' : 'bg-slate-200 text-slate-700');
        bg.textContent = `${roleLbl[ann.target_role] || 'الجميع'} • ${ann.is_active ? 'نشط' : 'متوقف'}`;
        h.append(tt, bg);
        const msg = document.createElement('p'); msg.className = 'text-xs font-bold text-[#0A4D68] whitespace-pre-line'; msg.textContent = ann.message;
        const dt = document.createElement('p'); dt.className = 'text-[10px] font-bold text-[#4A657A]'; dt.textContent = fmtDate(ann.created_at);
        const row = document.createElement('div'); row.className = 'flex gap-2';
        const tog = document.createElement('button'); tog.type = 'button';
        tog.className = 'rounded-xl border border-[#C2DBF0] bg-white px-3 py-1 text-[11px] font-black text-[#0A4D68]';
        tog.textContent = ann.is_active ? '⏸️ إيقاف' : '▶️ تفعيل';
        tog.addEventListener('click', async () => {
          await S.client.from('app_announcements').update({ is_active: !ann.is_active }).eq('id', ann.id);
          ann.is_active = !ann.is_active; renderTab(); showMsg('✓ تم التحديث');
        });
        const del = document.createElement('button'); del.type = 'button';
        del.className = 'rounded-xl bg-rose-700 px-3 py-1 text-[11px] font-black text-white';
        del.textContent = '🗑️ حذف';
        del.addEventListener('click', async () => {
          await S.client.from('app_announcements').delete().eq('id', ann.id);
          dataState.announcements = dataState.announcements.filter((x) => x.id !== ann.id);
          renderTab(); showMsg('✓ تم حذف الإعلان');
        });
        row.append(tog, del);
        c.append(h, msg, dt, row);
        box.appendChild(c);
      });
      return;
    }
    if (activeTab === 'alerts') {
      if (!dataState.alerts.length) { box.textContent = 'لا توجد تنبيهات حالياً.'; return; }
      dataState.alerts.forEach((al) => {
        const isOpen = al.status === 'open';
        const c = document.createElement('div');
        c.className = 'cg-card p-3.5 space-y-1.5 ' + (isOpen ? 'border-rose-300 bg-rose-50/40' : '');
        const p1 = document.createElement('p');
        p1.className = 'text-xs font-black text-rose-900';
        p1.textContent = `🚨 ${al.message || al.alert_type || 'تنبيه'}`;
        const p2 = document.createElement('p');
        p2.className = 'text-[11px] font-bold text-[#4A657A]';
        p2.textContent = `${al.status} • ${fmtDate(al.created_at)}`;
        c.append(p1, p2);
        if (isOpen) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'rounded-xl bg-[#0A4D68] px-3 py-1 text-[11px] font-black text-white';
          b.textContent = '✓ إغلاق التنبيه';
          b.addEventListener('click', async () => {
            await S.client.from('alerts').update({ status: 'resolved' }).eq('id', al.id);
            al.status = 'resolved';
            $('kpiAlerts').textContent = String(dataState.alerts.filter((x) => x.status === 'open').length);
            renderTab(); showMsg('✓ تم إغلاق التنبيه');
          });
          c.appendChild(b);
        }
        box.appendChild(c);
      });
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-adm-tab]');
    if (btn) {
      activeTab = btn.dataset.admTab;
      renderTab();
    }
  });
  $('admRefreshBtn').addEventListener('click', loadAll);
  if ($('admSearchInp')) $('admSearchInp').addEventListener('input', renderTab);

  (async function init() {
    user = await S.getSessionUser();
    const email = user && user.email ? String(user.email).toLowerCase() : '';
    if (!user) {
      $('admGuardBox').classList.remove('hidden');
      $('admGuardEmail').textContent = 'يرجى تسجيل الدخول بحساب الإدارة أولاً من البوابة.';
      return;
    }
    const { data: isAdm, error: admErr } = await S.client.rpc('is_cg_admin');
    if (admErr || !isAdm) {
      $('admGuardBox').classList.remove('hidden');
      $('admGuardEmail').textContent = email ? `الحساب الحالي غير مخوّل للإدارة: ${email}` : 'هذا الحساب غير مخوّل للوصول إلى لوحة الإدارة.';
      return;
    }
    $('admContentWrap').classList.remove('hidden');
    await loadAll();
  })();
})();
</script>
</body>
</html>
