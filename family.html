<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoinsDar — فضاء العائلة</title>
  <meta name="theme-color" content="#0E5A3E" />
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Fraunces:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="min-h-screen pb-24">

<!-- Top Header -->
<header class="sticky top-0 z-30 bg-gradient-to-b from-[#DFF3EA] via-[#ECF8F3] to-[#FAF6EE]/95 backdrop-blur border-b border-[#DCECE4]">
  <div class="mx-auto flex max-w-xl items-center justify-between gap-2 px-4 py-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <img src="./emblem-soinsdar.png" alt="SOINSDAR" class="h-11 w-auto shrink-0 object-contain" />
      <div class="min-w-0">
        <h1 id="hdrTitle" class="font-serif-brand truncate text-xl font-extrabold leading-none text-[#0E5A3E]">فضاء العائلة</h1>
        <p id="hdrSub" class="mt-0.5 text-[11px] font-bold text-[#5C6F63]">SOINSDAR • رعايتهم تجمعنا</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="ringtoneBtn" type="button" class="tap-btn flex h-9 w-9 items-center justify-center rounded-full border border-amber-300 bg-amber-50 text-amber-950"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
      <button id="pushBtn" type="button" class="tap-btn flex h-9 w-9 items-center justify-center rounded-full border border-rose-200 bg-rose-50 text-rose-900"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg></button>
      <button id="langBtn" type="button" class="tap-btn rounded-full border border-[#E8DFCE] bg-[#FFFDF8] px-3 py-1.5 text-xs font-black text-[#0E5A3E]">FR</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-xl space-y-4 px-4 pt-3">
  <div id="liveCheckInToast" class="hidden rounded-2xl border-2 border-emerald-400 bg-emerald-50 px-4 py-3 text-center text-xs font-black text-[#0E5A3E] shadow-sm"></div>
  <details id="leftHomeBanner" class="hidden rounded-3xl border-2 border-rose-500 bg-rose-50 p-3.5 shadow-md">
    <summary id="leftHomeSummary" class="cursor-pointer list-none flex items-center justify-between gap-2 text-xs font-black text-rose-950">
      <span id="leftHomeSumText">📍🚨 تنبيهات الخروج من المنزل</span>
      <span id="leftHomeSumHint" class="shrink-0 rounded-lg bg-rose-100 px-2 py-0.5 text-[11px] font-black text-rose-800">اضغط للعرض ▾</span>
    </summary>
    <div id="leftHomeList" class="mt-3 space-y-2.5"></div>
  </details>

  <!-- TAB 1: MY LINKED SENIORS -->
  <section id="secHome" class="space-y-3.5">
    <div class="cg-card p-4 space-y-2.5">
      <div class="flex items-center justify-between">
        <p id="linkTitle" class="text-sm font-black text-[#0E5A3E]">🔗 ربط المسنّ عبر الرمز (CG-...)</p>
        <button id="refreshBtn" type="button" class="rounded-xl border border-[#D8CEBE] bg-[#FAF6EE] px-2.5 py-1 text-xs font-black text-[#0E5A3E]">🔄 تحديث</button>
      </div>
      <div class="flex flex-wrap sm:flex-nowrap items-center gap-2">
        <input id="linkCodeInput" type="text" dir="ltr" placeholder="CG-123456" class="min-w-0 flex-1 rounded-xl border border-[#D8CEBE] bg-white px-3 py-2 text-sm font-black uppercase" />
        <select id="linkRelationSel" class="shrink-0 rounded-xl border border-[#D8CEBE] bg-[#FAF6EE] px-2.5 py-2 text-xs font-black text-[#163024]">
          <option value="ابن">ابن</option>
          <option value="ابنة">ابنة</option>
          <option value="أخ">أخ</option>
          <option value="أخت">أخت</option>
          <option value="زوج/ة">زوج/ة</option>
          <option value="حفيد/ة">حفيد/ة</option>
          <option value="قريب">قريب آخر</option>
        </select>
        <button id="linkSubmitBtn" type="button" class="tap-btn shrink-0 rounded-xl bg-[#0E5A3E] px-4 py-2 text-xs font-black text-white">ربط</button>
      </div>
      <p id="linkMsg" class="hidden text-xs font-extrabold"></p>
    </div>

    <div id="seniorsList" class="space-y-3.5"></div>
  </section>

  <!-- TAB 2: ALERTS -->
  <section id="secAlerts" class="hidden space-y-3">
    <h2 id="alertsHeading" class="text-lg font-black text-rose-900">🚨 التنبيهات النشطة</h2>
    <div id="alertsList" class="space-y-2.5"></div>
    <details id="resolvedAlertsDet" class="hidden rounded-2xl border border-[#DFEAE3] bg-white px-3.5 py-2.5 shadow-sm">
      <summary id="resolvedAlertsSum" class="cursor-pointer list-none flex items-center justify-between text-xs font-black text-[#0E5A3E]">
        <span>📋 سجل التقارير والتنبيهات السابقة</span>
        <span class="text-[11px] text-[#5C6F63]">اضغط للعرض ▾</span>
      </summary>
      <div id="resolvedAlertsList" class="mt-2.5 pt-2 border-t border-[#E6DCCB] space-y-2"></div>
    </details>
  </section>

  <!-- TAB 3: FIND / REQUEST NURSE + ACCOUNT -->
  <section id="secNurse" class="hidden space-y-3.5">
    <div class="cg-card p-4 space-y-3">
      <div>
        <h2 id="fnHeading" class="text-lg font-black text-[#0E5A3E]">🩺 طلب ممرض لقريبك</h2>
        <p id="fnSub" class="text-xs font-bold text-[#5C6F63]">ممرضون موثّقون في تونس مرتبون حسب القرب</p>
      </div>
      <select id="careReasonSel" class="w-full rounded-xl border border-[#D8CEBE] bg-[#FAF6EE] px-3 py-2.5 text-xs font-bold text-[#163024]">
        <option value="💉 حقنة / إبرة">💉 حقنة / إبرة (Injection)</option>
        <option value="🩹 تغيير ضمادات">🩹 تغيير ضمادات (Pansement)</option>
        <option value="💧 تركيب سيروم / مصل">💧 تركيب سيروم / مصل (Sérum)</option>
        <option value="🩺 قياس ضغط / سكري">🩺 قياس ضغط / سكري (Tension / Glycémie)</option>
        <option value="🏥 رعاية شاملة / مساعدة">🏥 رعاية شاملة / مساعدة</option>
      </select>
      <select id="genderPrefSel" class="w-full rounded-xl border border-[#D8CEBE] bg-[#FAF6EE] px-3 py-2.5 text-xs font-bold text-[#163024]">
        <option value="any">🤝 لا يهم (ممرض أو ممرضة)</option>
        <option value="female">👩‍⚕️ ممرضة فقط</option>
        <option value="male">👨‍⚕️ ممرض فقط</option>
      </select>
      <button id="broadcastBtn" type="button" class="tap-btn flex h-auto w-full items-center justify-between gap-2 rounded-2xl border-2 border-amber-400 bg-gradient-to-r from-amber-50 to-emerald-50 px-3.5 py-3 text-start shadow-sm">
        <div class="min-w-0 flex-1 space-y-0.5">
          <p id="bcTitle" class="text-sm font-black leading-snug text-[#0E5A3E]">⚡ طلب أقرب ممرض متاح الآن</p>
          <p id="bcSub" class="text-[11px] font-bold leading-snug text-[#5C6F63]">يرسل الطلب للجميع — أول ممرض يقبل يحضر</p>
        </div>
        <span id="bcBadge" class="shrink-0 rounded-xl bg-[#0E5A3E] px-3 py-1.5 text-xs font-black text-white">⚡ إرسال</span>
      </button>
      <div id="fnStatus" class="hidden rounded-2xl border border-emerald-400 bg-emerald-50 px-3 py-2 text-center text-xs font-black text-[#0E5A3E]"></div>
      <div id="nursesList" class="space-y-2.5"></div>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <button id="switchRoleBtn" type="button" class="tap-btn rounded-2xl border border-[#D8CEBE] bg-white px-4 py-3 text-xs font-black text-[#163024]">🔄 تغيير الدور</button>
      <button id="signOutBtn" type="button" class="tap-btn rounded-2xl border border-rose-300 bg-rose-50 px-4 py-3 text-xs font-black text-rose-900">🚪 تسجيل الخروج</button>
    </div>
  </section>
</main>

<!-- Bottom Navigation (Family Only) -->
<nav class="fixed bottom-0 inset-x-0 z-30 border-t border-[#E8DFCE] bg-[#FFFDF9]/95 backdrop-blur">
  <div class="mx-auto grid max-w-xl grid-cols-3 py-2 text-center text-xs font-black">
    <button id="navHome" type="button" class="flex flex-col items-center gap-1 text-[#0E5A3E]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>
      <span id="navHomeLbl">المتابعة</span>
    </button>
    <button id="navAlerts" type="button" class="flex flex-col items-center gap-1 text-[#5C6F63]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span><span id="navAlertsLbl">التنبيهات</span> (<span id="alertsCnt">0</span>)</span>
    </button>
    <button id="navNurse" type="button" class="flex flex-col items-center gap-1 text-[#5C6F63]">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4.5 4v5a4.5 4.5 0 009 0V4"/><path d="M9 13.5V16a5 5 0 0010 0v-2.5"/><circle cx="19" cy="11.5" r="2"/></svg>
      <span id="navNurseLbl">طلب ممرض</span>
    </button>
  </div>
</nav>

<!-- Ringtone Modal -->
<div id="ringtoneModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 p-4">
  <div class="w-full max-w-md rounded-3xl bg-[#FFFDF9] p-5 shadow-2xl border border-[#E6DCCB] space-y-3">
    <div class="flex items-center justify-between">
      <h3 class="text-lg font-black text-[#0E5A3E]">🎵 استوديو نغمات التنبيه</h3>
      <button id="closeRingModalBtn" type="button" class="rounded-xl px-3 py-1 text-lg font-black text-slate-600">✕</button>
    </div>
    <div id="ringStudioList" class="max-h-60 space-y-2 overflow-y-auto pr-0.5"></div>
    <select id="ringPresetSel" class="hidden">
      <option value="loud_phone">1</option><option value="urgent_alarm">2</option><option value="classic_bell">3</option>
      <option value="piano_melody">4</option><option value="morning_harp">5</option><option value="high_clarity">6</option>
      <option value="custom_file">custom</option>
    </select>
    <label for="customRingFile" class="tap-btn block w-full cursor-pointer rounded-2xl border-2 border-dashed border-amber-400 bg-amber-50 px-4 py-3 text-center text-xs font-black text-amber-950">
      🎵 اختر نغمة صوتية من الهاتف (MP3 / WAV / M4A)
    </label>
    <input id="customRingFile" type="file" accept="audio/*" class="hidden" />
    <p id="customRingStatus" class="text-center text-xs font-bold text-[#0E5A3E]"></p>
    <div class="grid grid-cols-2 gap-2">
      <button id="testRingBtn" type="button" class="tap-btn rounded-xl bg-amber-600 px-3 py-2.5 text-xs font-black text-white">🔊 تجربة النغمة</button>
      <button id="stopRingBtn" type="button" class="tap-btn rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-xs font-black text-slate-800">⏹️ إيقاف</button>
    </div>
  </div>
</div>

<!-- Family Direct Chat Modal -->
<div id="chatModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/75 p-3">
  <div class="flex max-h-[88vh] w-full max-w-md flex-col rounded-3xl bg-[#FFFDF9] p-4 shadow-2xl border border-[#E6DCCB]">
    <div class="flex items-center justify-between border-b border-[#EAE0CF] pb-2.5">
      <h3 id="chatTitle" class="text-base font-black text-[#0E5A3E]">💬 محادثة العائلة</h3>
      <button id="closeChatBtn" type="button" class="rounded-xl px-2.5 py-1 text-lg font-black text-slate-600">✕</button>
    </div>
    <div id="chatMessages" class="my-3 flex-1 space-y-2 overflow-y-auto min-h-[200px]"></div>
    <div class="flex gap-2">
      <button id="chatMicBtn" type="button" class="tap-btn rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-2 text-sm font-black text-[#0E5A3E]" title="رسالة صوتية">🎤</button>
      <input id="chatInput" type="text" placeholder="اكتب رسالة للمسنّ أو الممرض..." class="flex-1 rounded-xl border border-[#D8CEBE] bg-white px-3 py-2 text-sm font-bold" />
      <button id="chatSendBtn" type="button" class="tap-btn rounded-xl bg-[#0E5A3E] px-4 py-2 text-xs font-black text-white">إرسال</button>
    </div>
  </div>
</div>

<script src="./shared.js"></script>
<script>
(function () {
  'use strict';
  const S = window.CG_SHARED;
  const $ = S.$;
  let user = null;
  let linkedCards = [];
  let chatSeniorId = null;
  let cachedNurses = [];

  function switchTab(tab) {
    $('secHome').classList.toggle('hidden', tab !== 'home');
    $('secAlerts').classList.toggle('hidden', tab !== 'alerts');
    $('secNurse').classList.toggle('hidden', tab !== 'nurse');
    $('navHome').className = 'flex flex-col items-center gap-0.5 ' + (tab === 'home' ? 'text-[#0E5A3E]' : 'text-[#5C6F63]');
    $('navAlerts').className = 'flex flex-col items-center gap-0.5 ' + (tab === 'alerts' ? 'text-[#0E5A3E]' : 'text-[#5C6F63]');
    $('navNurse').className = 'flex flex-col items-center gap-0.5 ' + (tab === 'nurse' ? 'text-[#0E5A3E]' : 'text-[#5C6F63]');
    if (tab === 'nurse') loadNurses();
  }

  function applyTexts() {
    const isFr = S.getLang() === 'fr';
    $('langBtn').textContent = isFr ? 'عربي' : 'FR';
    $('hdrTitle').textContent = isFr ? 'Espace Famille' : 'فضاء العائلة';
    $('hdrSub').textContent = isFr ? 'SOINSDAR • La maison du bien-être' : 'SOINSDAR • رعايتهم تجمعنا';
    $('navHomeLbl').textContent = isFr ? 'Suivi' : 'المتابعة';
    $('navAlertsLbl').textContent = isFr ? 'Alertes' : 'التنبيهات';
    $('navNurseLbl').textContent = isFr ? 'Infirmier' : 'طلب ممرض';
    $('bcTitle').textContent = isFr ? '⚡ 1er infirmier disponible' : '⚡ طلب أقرب ممرض متاح الآن';
    $('bcSub').textContent = isFr ? 'Envoyé à tous — le 1er qui accepte vient' : 'يرسل الطلب للجميع — أول ممرض يقبل يحضر';
    $('switchRoleBtn').textContent = isFr ? '🔄 Changer de rôle' : '🔄 تغيير الدور';
    $('signOutBtn').textContent = isFr ? '🚪 Déconnexion' : '🚪 تسجيل الخروج';
    const opts = $('genderPrefSel').options;
    if (opts && opts.length >= 3) {
      opts[0].textContent = isFr ? '🤝 Peu importe (Homme ou Femme)' : '🤝 لا يهم (ممرض أو ممرضة)';
      opts[1].textContent = isFr ? '👩‍⚕️ Infirmière uniquement' : '👩‍⚕️ ممرضة فقط';
      opts[2].textContent = isFr ? '👨‍⚕️ Infirmier uniquement' : '👨‍⚕️ ممرض فقط';
    }
  }

  async function loadFamilyData() {
    if (!S.client || !user) return;
    const isFr = S.getLang() === 'fr';
    const { data: links } = await S.client
      .from('senior_care_links')
      .select('id, senior_id, status, senior_profiles(id, display_name, senior_phone, blood_type, allergies, conditions, home_address, home_lat, home_lng, avatar_url, water_count, water_date)')
      .eq('requester_user_id', user.id);

    const todayStr = S.getLocalDateStr();
    const todayStart = S.getLocalDayStartIso();
    linkedCards = await Promise.all((links || []).map(async (lk) => {
      if (lk.status !== 'approved') return { kind: 'pending', lk };
      const sp = lk.senior_profiles || { id: lk.senior_id, display_name: 'المسنّ' };
      const [{ data: chk }, { data: bat }, { data: meds }, { data: logs }, { data: alerts }, { data: resolvedAlerts }, { data: dms }, { data: appts }] = await Promise.all([
        S.client.from('safety_checkins').select('checked_in_at').eq('senior_id', sp.id).order('checked_in_at', { ascending: false }).limit(1),
        (async () => { let r = await S.client.from('device_status').select('battery_percent').eq('senior_id', sp.id).order('created_at', { ascending: false }).limit(1); if (r.error || !r.data || !r.data.length) r = await S.client.from('device_status').select('battery_percent').eq('senior_id', sp.id).order('recorded_at', { ascending: false }).limit(1); if (r.error) r = await S.client.from('device_status').select('battery_percent').eq('senior_id', sp.id).limit(200); return r; })(),
        S.client.from('medications').select('id, name, dosage').eq('senior_id', sp.id),
        S.client.from('medication_logs').select('medication_id, status, logged_at').eq('senior_id', sp.id).gte('logged_at', todayStart),
        S.client.from('alerts').select('id, message, alert_type, created_at').eq('senior_id', sp.id).eq('status', 'open').order('created_at', { ascending: false }).limit(15),
        S.client.from('alerts').select('id, message, alert_type, created_at').eq('senior_id', sp.id).eq('status', 'resolved').order('created_at', { ascending: false }).limit(15),
        S.client.from('care_direct_messages').select('id, sender_user_id, sender_name, message_text, created_at, read_at').eq('senior_id', sp.id).eq('channel', 'family').gte('created_at', new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()).order('created_at', { ascending: false }).limit(1),
        S.client.from('medical_appointments').select('id, appt_type, title, location, appt_at, fasting_required').eq('senior_id', sp.id).eq('status', 'upcoming').gte('appt_at', new Date(Date.now() - 2 * 3600000).toISOString()).order('appt_at', { ascending: true }).limit(10)
      ]);
      const takenSet = new Set((logs || []).filter((l) => l.status === 'taken').map((l) => l.medication_id));
      const takenTimeMap = new Map();
      (logs || []).forEach((l) => {
        if (l.status === 'taken' && l.logged_at) {
          takenTimeMap.set(l.medication_id, new Date(l.logged_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }
      });
      return {
        kind: 'approved',
        sp,
        lastChk: chk && chk[0] ? new Date(chk[0].checked_in_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : (isFr ? 'Aucun' : 'لا يوجد'),
        batPct: bat && bat.length ? bat[bat.length === 1 ? 0 : bat.length - 1].battery_percent + '%' : '--%',
        meds: meds || [],
        takenSet,
        takenTimeMap,
        water: sp.water_date === todayStr ? (sp.water_count || 0) : 0,
        alerts: alerts || [],
        resolvedAlerts: resolvedAlerts || [],
        appts: appts || [],
        lastDm: dms && dms[0] ? dms[0] : null
      };
    }));
    renderFamilyCards();
  }

  function formatAlertDisplay(al, seniorName, isFr) {
    const raw = String((al && al.message) || (al && al.alert_type) || '');
    const mapMatch = raw.match(/https?:\/\/maps\.google\.com\/\?q=[^\s]+/);
    const mapUrl = mapMatch ? mapMatch[0] : '';
    const clean = raw.replace(/https?:\/\/maps\.google\.com\/\?q=[^\s]+/g, '').replace(/[—\-\s]+$/, '').trim();
    const nm = seniorName || (isFr ? 'Le senior' : 'المسنّ');
    let text = clean;

    if (/left home zone/i.test(clean) || (al && al.alert_type === 'left_home' && /away/i.test(clean))) {
      const dm = clean.match(/\(([^)]+)\s*away\)/i);
      const dist = dm ? dm[1].replace(/m$/i, isFr ? ' m' : ' م').replace(/km$/i, isFr ? ' km' : ' كم') : '';
      text = isFr
        ? `📍 ${nm} a quitté le domicile${dist ? ' (' + dist + ')' : ''}`
        : `📍 ابتعد ${nm} عن مكان الإقامة المسجّل${dist ? ' (' + dist + ')' : ''}`;
    } else if (/has not checked in for\s*(\d+h)/i.test(clean)) {
      const h = clean.match(/(\d+h)/i)[1];
      const hrs = h.replace('h', '');
      text = isFr
        ? `🟠 Alerte (${h}) : ${nm} n'a pas confirmé sa sécurité depuis ${h}`
        : `🟠 تنبيه (${hrs} ساعات): ${nm} لم يؤكد سلامته منذ ${hrs} ساعات`;
    } else if (/has not confirmed safety for\s*10\+\s*hours/i.test(clean) || /URGENT\s*\(10h\+\)/i.test(clean)) {
      text = isFr
        ? `🚨 URGENT (10h+) : ${nm} n'a pas confirmé sa sécurité depuis plus de 10 heures !`
        : `🚨 عاجل (+10 ساعات): ${nm} لم يؤكد سلامته منذ أكثر من 10 ساعات!`;
    } else if (/battery/i.test(clean) && !/[\u0600-\u06FF]/.test(clean) && !isFr) {
      const pct = (clean.match(/(\d+%)/) || [])[1] || '';
      text = `🔋 بطارية هاتف ${nm} منخفضة${pct ? ' (' + pct + ')' : ''} — يرجى شحن الهاتف`;
    } else if (/missed/i.test(clean) && !/[\u0600-\u06FF]/.test(clean) && !isFr) {
      text = `💊 تنبيه دواء فائت: لم يتم تأكيد تناول الدواء في موعده (${nm})`;
    }
    return { text: text || (isFr ? 'Alerte active' : 'تنبيه نشط'), mapUrl };
  }

  function renderFamilyCards() {
    const isFr = S.getLang() === 'fr';
    const box = $('seniorsList');
    const alBox = $('alertsList');
    const lhBox = $('leftHomeBanner');
    const lhList = $('leftHomeList');
    const fmtAlertTs = (ts) => {
      if (!ts) return '';
      try {
        const d = new Date(ts);
        return d.toLocaleString(isFr ? 'fr-TN' : 'ar-TN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return ''; }
    };
    box.replaceChildren();
    alBox.replaceChildren();
    const resList = $('resolvedAlertsList');
    const resDet = $('resolvedAlertsDet');
    if (resList) resList.replaceChildren();
    let totalResolved = 0;
    if (lhList) lhList.replaceChildren();
    let leftHomeCount = 0;
    const leftHomeIds = [];

    let totalAlerts = 0;
    if (!linkedCards.length) {
      const emp = document.createElement('div');
      emp.className = 'cg-card p-6 text-center text-xs font-bold text-[#5C6F63]';
      emp.textContent = isFr ? 'Aucun proche lié — entrez le code CG-... ci-dessus.' : 'لا يوجد قريب مرتبط بعد — أدخل رمز المسنّ (CG-...) أعلاه.';
      box.appendChild(emp);
    }

    linkedCards.forEach((item) => {
      if (item.kind !== 'approved') {
        const pend = document.createElement('div');
        pend.className = 'rounded-2xl border border-amber-300 bg-amber-50 p-4 text-xs font-black text-amber-950';
        pend.textContent = isFr ? '⏳ Demande de liaison en attente d\'approbation.' : '⏳ طلب الربط بانتظار موافقة المسنّ.';
        box.appendChild(pend);
        return;
      }
      const { sp, lastChk, batPct, meds, takenSet, takenTimeMap, water, alerts, resolvedAlerts, appts, lastDm } = item;
      totalAlerts += alerts.length;

      // Alerts tab items + Persistent Home-Departure Banner
      alerts.forEach((al) => {
        const isDaily = al.alert_type === 'daily_report';
        const isLeftHome = al.alert_type === 'left_home';
        const row = document.createElement('div');
        row.className = isDaily
          ? 'flex flex-col gap-2 rounded-2xl border-2 border-emerald-300 bg-emerald-50/90 p-3.5 text-xs font-bold text-[#163024]'
          : 'flex items-center justify-between gap-2 rounded-2xl border border-rose-300 bg-rose-50 p-3 text-xs font-black text-rose-950';
        const txt = document.createElement('div');
        txt.className = 'min-w-0 flex-1 whitespace-pre-line leading-relaxed';
        const fmt = formatAlertDisplay(al, sp.display_name, isFr);
        const tsStr = fmtAlertTs(al.created_at);
        const tsTag = tsStr ? `🕒 ${tsStr}\n` : '';
        txt.textContent = isDaily
          ? `${tsTag}📊 ${sp.display_name || ''} — ${fmt.text}`
          : `${tsTag}${isLeftHome ? '📍🚨' : '🚨'} ${fmt.text}`;
        const okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = isDaily
          ? 'self-end rounded-xl bg-[#0E5A3E] px-3 py-1.5 text-[11px] font-black text-white'
          : 'shrink-0 rounded-xl bg-rose-700 px-3 py-1.5 text-[11px] font-black text-white';
        okBtn.textContent = isLeftHome
          ? (isFr ? 'Vu / Nous sommes informés ✓' : 'تمت الرؤية / علمنا بذلك ✓')
          : (isFr ? 'Vu ✓' : 'تمت الرؤية ✓');
        okBtn.addEventListener('click', async () => {
          await S.client.from('alerts').update({ status: 'resolved' }).eq('id', al.id);
          loadFamilyData();
        });
        row.append(txt, okBtn);
        alBox.appendChild(row);

        if (isLeftHome && lhList) {
          leftHomeCount++;
          leftHomeIds.push(al.id);
          const banner = document.createElement('div');
          banner.className = 'rounded-2xl border border-rose-300 bg-white p-3 shadow-sm space-y-2';
          const bTop = document.createElement('div');
          bTop.className = 'flex items-center justify-between gap-2';

          bTime.className = 'rounded-lg bg-rose-100 px-2 py-0.5 text-[11px] font-black text-rose-900';
          bTime.textContent = tsStr ? `🕒 ${tsStr}` : (isFr ? 'Maintenant' : 'الآن');
          bTop.appendChild(bTime);
          const bTxt = document.createElement('p');
          bTxt.className = 'text-xs font-black text-rose-950 leading-relaxed';
          bTxt.textContent = `📍🚨 ${formatAlertDisplay(al, sp.display_name, isFr).text}`;
          const bActions = document.createElement('div');
          bActions.className = 'flex flex-wrap items-center justify-between gap-2';

          if (mapMatch) {
            const mLink = document.createElement('a');
            mLink.href = mapMatch[0]; mLink.target = '_blank'; mLink.rel = 'noopener noreferrer';

            mLink.textContent = isFr ? '🗺️ Voir position' : '🗺️ فتح الموقع على الخريطة';

if (resList && resolvedAlerts && resolvedAlerts.length) {

        img.src = sp.avatar_url; img.className = 'h-full w-full object-cover';

      const nm = document.createElement('p');
      nm.className = 'text-lg font-black text-[#163024] truncate';

      const sub = document.createElement('p');
      sub.className = 'text-xs font-bold text-[#5C6F63]';
      sub.textContent = `🔋 ${batPct} • 💊 ${meds.filter((m) => takenSet.has(m.id)).length}/${meds.length} • 💧 ${water}/8`;
      info.append(nm, sub);
      top.append(av, info);
      card.appendChild(top);
      const okBadge = document.createElement('div');
      okBadge.className = 'flex items-center justify-between gap-2 rounded-2xl border border-emerald-300 bg-emerald-50 px-3.5 py-2.5 text-xs font-black text-[#0E5A3E]';
      okBadge.textContent = isFr
        ? `💚 ${sp.display_name || 'Votre proche'} va bien — confirmé à ${lastChk}`
        : `💚 ${sp.display_name || 'قريبك'} بخير — آخر تأكيد الساعة ${lastChk}`;

      if (meds.length) {
        const det = document.createElement('details');
        det.className = 'rounded-2xl bg-[#FAF6EE] border border-[#E6DCCB] px-3 py-2.5';

        sum.className = 'cursor-pointer list-none flex items-center justify-between gap-2 text-xs font-black text-[#0E5A3E]';
        const takenCnt = meds.filter((m) => takenSet.has(m.id)).length;
        const sLeft = document.createElement('span');
        sLeft.textContent = isFr ? `💊 Médicaments (${takenCnt}/${meds.length})` : `💊 أدوية المسنّ (${takenCnt}/${meds.length})`;
        const sRight = document.createElement('span');
        sRight.className = 'text-[11px] text-[#5C6F63]';
        sRight.textContent = isFr ? 'Voir la liste ▾' : 'اضغط للعرض ▾';
        sum.append(sLeft, sRight);
        det.appendChild(sum);
        const mWrap = document.createElement('div');
        mWrap.className = 'mt-2.5 pt-2 border-t border-[#E6DCCB] space-y-1.5';
        meds.forEach((m) => {
          const isT = takenSet.has(m.id);
          const row = document.createElement('div');
          row.className = 'flex flex-wrap items-center justify-between gap-1.5 border-b border-[#EDE4D4] pb-1.5 last:border-0 last:pb-0 text-xs font-bold';
          const l = document.createElement('span');
          l.className = 'min-w-0 flex-1 break-words leading-snug text-[#163024]';
          l.dir = 'auto';
          l.textContent = `${m.name}${m.dosage ? ' (' + m.dosage + ')' : ''}`;
          const r = document.createElement('span');
          r.className = isT ? 'shrink-0 rounded-full bg-emerald-100 px-2 py-0.5 text-[#0E5A3E]' : 'shrink-0 rounded-full bg-amber-100 px-2 py-0.5 text-amber-900';
          const tAt = isT && takenTimeMap.get(m.id) ? (' ' + takenTimeMap.get(m.id)) : '';
          r.textContent = isT ? ((isFr ? '✓ Pris' : '✓ تم التناول') + tAt) : (isFr ? '⏳ En attente' : '⏳ لم يُؤخذ');
          row.append(l, r);
          mWrap.appendChild(row);
        });
        det.appendChild(mWrap);
        card.appendChild(det);
      }

      if (appts && appts.length) {
        const aDet = document.createElement('details');
        aDet.className = 'rounded-2xl bg-[#F4F1FC] border border-[#D4CBEB] px-3 py-2.5';
        const aSum = document.createElement('summary');
        aSum.className = 'cursor-pointer list-none flex items-center justify-between gap-2 text-xs font-black text-indigo-950';
        const aL = document.createElement('span');
        aL.textContent = isFr ? `📅 Rendez-vous médicaux (${appts.length})` : `📅 المواعيد الطبية القادمة (${appts.length})`;
        const aR = document.createElement('span');
        aR.className = 'text-[11px] text-indigo-700';
        aR.textContent = isFr ? 'Voir ▾' : 'عرض ▾';
        aSum.append(aL, aR);
        aDet.appendChild(aSum);
        const aWrap = document.createElement('div');
        aWrap.className = 'mt-2 pt-2 border-t border-[#D4CBEB] space-y-1.5 text-xs font-bold text-[#163024]';
        appts.forEach((ap) => {
          const dt = new Date(ap.appt_at);
          const row = document.createElement('div');
          row.className = 'border-b border-[#E4DDF5] pb-1 last:border-0 last:pb-0';
          row.textContent = `📅 ${ap.title} — ${dt.toLocaleDateString([], { day: '2-digit', month: '2-digit' })} ${dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` + (ap.location ? ` (${ap.location})` : '') + (ap.fasting_required ? (isFr ? ' • À jeun' : ' • صائم') : '');
          aWrap.appendChild(row);
        });
        aDet.appendChild(aWrap);
        card.appendChild(aDet);
      }

      const seenTs = Number(localStorage.getItem('cg_v2_fam_seen_' + sp.id) || 0);
      const dmTs = lastDm && lastDm.created_at ? new Date(lastDm.created_at).getTime() : 0;
      const hasUnread = !!(lastDm && !lastDm.read_at && dmTs > seenTs && lastDm.sender_user_id !== user.id);

      const acts = document.createElement('div');
      acts.className = 'flex gap-2';
      if (sp.senior_phone && S.safeTelHref(sp.senior_phone)) {
        const callA = document.createElement('a');
        callA.href = S.safeTelHref(sp.senior_phone);
        callA.className = 'tap-btn flex-1 text-center rounded-xl border border-[#D8CEBE] bg-white px-3 py-2 text-xs font-black text-[#163024]';
        callA.textContent = isFr ? '📞 Appeler' : '📞 اتصال';
        acts.appendChild(callA);
      }
      const chatBtn = document.createElement('button');
      chatBtn.type = 'button';
      chatBtn.className = hasUnread
        ? 'tap-btn flex-1 rounded-xl bg-rose-600 px-3 py-2 text-xs font-black text-white animate-pulse'
        : 'tap-btn flex-1 rounded-xl bg-[#0E5A3E] px-3 py-2 text-xs font-black text-white';
      chatBtn.textContent = hasUnread ? (isFr ? '🔴 Nouveau message' : '🔴 رسالة جديدة') : (isFr ? '💬 Message' : '💬 رسالة طمأنة');
      chatBtn.addEventListener('click', () => {
        localStorage.setItem('cg_v2_fam_seen_' + sp.id, String(Date.now()));
        openChat(sp.id, sp.display_name);
        renderFamilyCards();
      });
      acts.appendChild(chatBtn);
      card.appendChild(acts);
      box.appendChild(card);
    });

    $('alertsCnt').textContent = String(totalAlerts);
    if (resDet) { resDet.classList.toggle('hidden', totalResolved === 0); if ($('resolvedAlertsSum') && $('resolvedAlertsSum').firstElementChild) $('resolvedAlertsSum').firstElementChild.textContent = (isFr ? '📋 Historique des rapports et alertes (' : '📋 سجل التقارير والتنبيهات السابقة (') + totalResolved + ')'; }
    if (lhBox) {
      lhBox.classList.toggle('hidden', leftHomeCount === 0);
      if ($('leftHomeSumText')) {
        $('leftHomeSumText').textContent = (isFr ? '📍🚨 Alertes sortie du domicile (' : '📍🚨 تنبيهات الخروج من المنزل (') + leftHomeCount + ')';
      }
      if ($('leftHomeSumHint')) {
        $('leftHomeSumHint').textContent = isFr ? 'Afficher ▾' : 'اضغط للعرض ▾';
      }
      if (leftHomeCount > 1 && lhList) {
        const ackAllBtn = document.createElement('button');
        ackAllBtn.type = 'button';
        ackAllBtn.className = 'w-full rounded-xl bg-rose-800 px-3 py-2 text-xs font-black text-white shadow';
        ackAllBtn.textContent = isFr
          ? `✓ Tout marquer comme vu (${leftHomeCount})`
          : `✓ علمنا بجميع التنبيهات وإخفاؤها (${leftHomeCount})`;
        ackAllBtn.addEventListener('click', async () => {
          await S.client.from('alerts').update({ status: 'resolved' }).in('id', leftHomeIds);
          loadFamilyData();
        });
        lhList.prepend(ackAllBtn);
      }
    }
    if (!totalAlerts) {
      const ok = document.createElement('div');
      ok.className = 'cg-card p-6 text-center text-xs font-bold text-[#0E5A3E]';
      ok.textContent = isFr ? '🟢 Aucune alerte active.' : '🟢 لا توجد تنبيهات نشطة حالياً — كل شيء بخير.';
      alBox.appendChild(ok);
    }
  }

  async function openChat(sid, name) {
    chatSeniorId = sid;
    $('chatTitle').textContent = (S.getLang() === 'fr' ? '💬 Famille & Senior : ' : '💬 محادثة العائلة والمسنّ: ') + (name || '');
    $('chatModal').classList.remove('hidden');
    await S.client.from('care_direct_messages').update({ read_at: new Date().toISOString() }).eq('senior_id', sid).eq('channel', 'family').neq('sender_user_id', user.id).is('read_at', null);
    await loadChat();
  }

  async function loadChat() {
    if (!chatSeniorId) return;
    const since24h = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
    const { data } = await S.client.from('care_direct_messages').select('*').eq('senior_id', chatSeniorId).eq('channel', 'family').gte('created_at', since24h).order('created_at', { ascending: true }).limit(50);
    const box = $('chatMessages');
    box.replaceChildren();
    const note = document.createElement('p');
    note.className = 'text-center text-[10px] font-bold text-[#5C6F63] pb-1';
    note.textContent = S.getLang() === 'fr' ? '🕒 Messages effacés automatiquement après 24h' : '🕒 تُمسح الرسائل تلقائياً بعد 24 ساعة';
    box.appendChild(note);
    (data || []).forEach((m) => box.appendChild(S.renderChatMessageEl(m, user.id)));
    box.scrollTop = box.scrollHeight;
  }

  async function loadNurses() {
    const { data } = await S.client.from('nurse_profiles').select('*').eq('country', 'TN').eq('directory_opt_in', true).neq('is_banned', true);
    const nowMs = Date.now();
    cachedNurses = (data || []).filter((n) => !(n.suspended_until && new Date(n.suspended_until).getTime() > nowMs));
    renderNurses();
  }

  function renderNurses() {
    const isFr = S.getLang() === 'fr';
    const gPref = $('genderPrefSel').value;
    const list = cachedNurses.filter((n) => gPref === 'any' || (n.gender || 'male') === gPref);
    const box = $('nursesList');
    box.replaceChildren();
    if (!list.length) {
      const emp = document.createElement('p');
      emp.className = 'text-center text-xs font-bold text-[#5C6F63] py-4';
      emp.textContent = isFr ? 'Aucun infirmier trouvé.' : 'لا يوجد ممرضون مطابقون حالياً.';
      box.appendChild(emp);
      return;
    }
    list.forEach((n) => {
      const c = document.createElement('div');
      c.className = 'rounded-2xl border border-[#DFD5C5] bg-white p-3.5 space-y-2';
      const nm = document.createElement('p');
      nm.className = 'text-sm font-black text-[#163024]';
      nm.textContent = `${n.full_name || 'ممرض'} • ${n.region ? S.formatGovLabel(n.region) : 'تونس'}` + (n.city_zip ? ` (${n.city_zip})` : '');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tap-btn w-full rounded-xl bg-[#0E5A3E] px-3 py-2 text-xs font-black text-white';
      btn.textContent = isFr ? '📋 Demander une visite' : '📋 طلب زيارة';
      btn.addEventListener('click', () => sendNurseReq('direct', n.user_id, n.full_name));
      c.append(nm, btn);
      box.appendChild(c);
    });
  }

  async function sendNurseReq(mode, nurseUid, nurseName) {
    const st = $('fnStatus');
    const firstSenior = linkedCards.find((x) => x.kind === 'approved');
    const sp = firstSenior ? firstSenior.sp : null;
    const chkQ = sp
      ? S.client.from('nurse_visit_requests').select('id, status, requester_name').or(`senior_id.eq.${sp.id},requester_user_id.eq.${user.id}`).in('status', ['open', 'pending', 'accepted']).limit(1)
      : S.client.from('nurse_visit_requests').select('id, status, requester_name').eq('requester_user_id', user.id).in('status', ['open', 'pending', 'accepted']).limit(1);
    const { data: active } = await chkQ;
    if (active && active[0]) {
      st.replaceChildren();
      st.classList.remove('hidden');
      const p = document.createElement('p');
      p.textContent = `⚠️ يوجد طلب نشط حالياً لهذا المريض (من: ${active[0].requester_name || 'المسنّ/العائلة'}).`;
      st.appendChild(p);
      if (active[0].status !== 'accepted') {
        const cBtn = document.createElement('button');
        cBtn.type = 'button';
        cBtn.className = 'mt-2 tap-btn rounded-xl border border-rose-300 bg-rose-50 px-3 py-1.5 text-xs font-black text-rose-900';
        cBtn.textContent = '✕ إلغاء الطلب الحالي الآن';
        cBtn.addEventListener('click', async () => {
          await S.client.from('nurse_visit_requests').update({ status: 'declined', senior_outcome: 'cancelled' }).eq('id', active[0].id);
          st.textContent = '✓ تم إلغاء الطلب السابق. يمكنك الآن إرسال طلب جديد.';
        });
        st.appendChild(cBtn);
      }
      return;
    }
    const compQ = sp
      ? S.client.from('nurse_visit_requests').select('id, accepted_by_user_id, nurse_user_id, accepted_by_name, nurse_name, nurse_outcome').or(`senior_id.eq.${sp.id},requester_user_id.eq.${user.id}`).eq('status', 'completed').order('created_at', { ascending: false }).limit(1)
      : S.client.from('nurse_visit_requests').select('id, accepted_by_user_id, nurse_user_id, accepted_by_name, nurse_name, nurse_outcome').eq('requester_user_id', user.id).eq('status', 'completed').order('created_at', { ascending: false }).limit(1);
    const { data: compRows } = await compQ;
    if (compRows && compRows[0] && (compRows[0].accepted_by_user_id || compRows[0].nurse_user_id)) {
      const lr = compRows[0];
      const nUid = lr.accepted_by_user_id || lr.nurse_user_id;
      const { data: exRev } = await S.client.from('nurse_reviews').select('id').eq('visit_request_id', lr.id).maybeSingle();
      if (!exRev) {
        st.replaceChildren();
        st.classList.remove('hidden');
        const box = document.createElement('div');
        box.className = 'rounded-2xl border-2 border-amber-400 bg-amber-50 p-3.5 space-y-2.5 text-right';
        const h = document.createElement('p');
        h.className = 'text-xs font-black text-amber-950';
        h.textContent = `⚠️ يجب تقييم الخدمة السابقة (${lr.accepted_by_name || lr.nurse_name || 'الممرض'}) قبل طلب خدمة جديدة:`;
        let fRating = 5;
        const stars = document.createElement('div'); stars.className = 'flex justify-center gap-2';
        const sBtns = [];
        const syncS = () => sBtns.forEach((b, i) => { b.textContent = i < fRating ? '★' : '☆'; b.className = 'text-2xl ' + (i < fRating ? 'text-amber-500' : 'text-slate-300'); });
        for (let i = 1; i <= 5; i++) {
          const sb = document.createElement('button'); sb.type = 'button';
          sb.addEventListener('click', () => { fRating = i; syncS(); });
          sBtns.push(sb); stars.appendChild(sb);
        }
        syncS();
        const cmt = document.createElement('input');
        cmt.type = 'text'; cmt.placeholder = 'ملاحظة أو تقييم مختصر (اختياري)...';
        cmt.className = 'w-full rounded-xl border border-[#D8CEBE] bg-white px-3 py-2 text-xs font-bold';
        const sub = document.createElement('button');
        sub.type = 'button'; sub.className = 'tap-btn w-full rounded-xl bg-[#0E5A3E] py-2 text-xs font-black text-white';
        sub.textContent = '⭐ إرسال التقييم وفتح الطلب الجديد';
        sub.addEventListener('click', async () => {
          sub.disabled = true; sub.textContent = '⏳ جاري الحفظ...';
          try {
            await S.client.from('nurse_visit_requests').update({ senior_outcome: 'completed' }).eq('id', lr.id);
            const { error: revErr } = await S.client.from('nurse_reviews').upsert({
              visit_request_id: lr.id,
              nurse_user_id: nUid,
              reviewer_user_id: user.id,
              reviewer_name: (user.user_metadata && user.user_metadata.full_name) || 'العائلة',
              rating: fRating,
              is_complaint: fRating <= 2,
              comment: cmt.value.trim() || null
            }, { onConflict: 'visit_request_id' });
            if (revErr) throw revErr;
            st.textContent = '✅ تم حفظ التقييم! يمكنك الآن إرسال طلبك الجديد.';
          } catch (err) {
            sub.disabled = false; sub.textContent = '⚠️ ' + (err.message || 'خطأ');
          }
        });
        box.append(h, stars, cmt, sub);
        st.appendChild(box);
        return;
      }
    }
    const sLat = sp ? (sp.home_lat || null) : null;
    const sLng = sp ? (sp.home_lng || null) : null;
    const reqGov = (sLat && sLng) ? S.detectTnGovernorate(sLat, sLng) : '';
    const basePayload = {
      senior_id: sp ? sp.id : null,
      requester_user_id: user.id,
      requester_name: (user.user_metadata && user.user_metadata.full_name) || 'العائلة',
      requester_phone: sp ? (sp.senior_phone || null) : null,
      senior_lat: sLat,
      senior_lng: sLng,
      care_reason: $('careReasonSel').value,
      preferred_gender: $('genderPrefSel').value,
      request_mode: mode,
      nurse_user_id: mode === 'open' ? null : nurseUid,
      nurse_name: mode === 'open' ? null : (nurseName || 'ممرض'),
      status: mode === 'open' ? 'open' : 'pending'
    };
    let { error } = await S.client.from('nurse_visit_requests').insert(reqGov ? Object.assign({ region: reqGov }, basePayload) : basePayload);
    if (error && /region/i.test(error.message || '')) {
      ({ error } = await S.client.from('nurse_visit_requests').insert(basePayload));
    }
    st.classList.remove('hidden');
    st.textContent = error ? ('⚠️ ' + error.message) : '✅ تم إرسال طلب الزيارة بنجاح!';
  }

  // Wiring
  $('navHome').addEventListener('click', () => switchTab('home'));
  $('navAlerts').addEventListener('click', () => switchTab('alerts'));
  $('navNurse').addEventListener('click', () => switchTab('nurse'));
  $('refreshBtn').addEventListener('click', loadFamilyData);
  $('genderPrefSel').addEventListener('change', renderNurses);
  $('broadcastBtn').addEventListener('click', () => sendNurseReq('open', null, null));
  $('closeChatBtn').addEventListener('click', () => $('chatModal').classList.add('hidden'));
  $('langBtn').addEventListener('click', () => { S.setLang(S.getLang() === 'fr' ? 'ar' : 'fr'); applyTexts(); renderFamilyCards(); });
  $('switchRoleBtn').addEventListener('click', () => { window.location.href = './index.html?choose=1'; });
  $('signOutBtn').addEventListener('click', S.signOut);

  $('linkSubmitBtn').addEventListener('click', async () => {
    const isFr = S.getLang() === 'fr';
    const code = ($('linkCodeInput').value || '').trim().toUpperCase();
    const msg = $('linkMsg');
    if (!code) return;
    const baseName = (user && user.user_metadata && user.user_metadata.full_name) || (isFr ? 'Famille' : 'العائلة');
    const rel = $('linkRelationSel') ? $('linkRelationSel').value : '';
    const myName = rel ? `${baseName} (${rel})` : baseName;
    const { error } = await S.client.rpc('request_link_by_code', {
      p_code: code,
      p_role: 'family',
      p_name: myName
    });
    msg.className = error ? 'text-xs font-extrabold text-rose-800' : 'text-xs font-extrabold text-emerald-800';
    msg.textContent = error
      ? ('⚠️ ' + (error.message || (isFr ? 'Code introuvable' : 'رمز غير موجود')))
      : (isFr ? '✓ Demande envoyée — en attente de validation du senior.' : '✓ تم إرسال طلب الربط — بانتظار موافقة المسنّ.');
    msg.classList.remove('hidden');
    if (!error) { $('linkCodeInput').value = ''; loadFamilyData(); }
  });

  S.attachVoiceRecorder($('chatMicBtn'), async (audioData) => {
    if (!chatSeniorId || !audioData) return;
    await S.client.from('care_direct_messages').insert({
      senior_id: chatSeniorId,
      sender_user_id: user.id,
      sender_name: (user.user_metadata && user.user_metadata.full_name) || 'العائلة',
      sender_role: 'family',
      channel: 'family',
      audio_data: audioData
    });
    loadChat();
  });
  $('chatSendBtn').addEventListener('click', async () => {
    const txt = ($('chatInput').value || '').trim();
    if (!txt || !chatSeniorId) return;
    $('chatInput').value = '';
    await S.client.from('care_direct_messages').insert({
      senior_id: chatSeniorId,
      sender_user_id: user.id,
      sender_name: (user.user_metadata && user.user_metadata.full_name) || 'العائلة',
      sender_role: 'family',
      channel: 'family',
      message_text: txt
    });
    loadChat();
  });

  $('pushBtn').addEventListener('click', async () => {
    const r = await S.toggleWebPush(user);
    if (r.ok) {
      $('pushBtn').className = r.active
        ? 'tap-btn rounded-full bg-emerald-700 px-2.5 py-1.5 text-xs font-black text-white'
        : 'tap-btn rounded-full border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-xs font-black text-rose-900';
      $('pushBtn').textContent = r.active ? '🔔 ✓' : '🔔';
    }
  });

  $('ringtoneBtn').addEventListener('click', () => {
    $('ringPresetSel').value = localStorage.getItem(S.CONFIG.RINGTONE_KEY) || 'loud_phone';
    if (S.renderRingtoneStudio) S.renderRingtoneStudio($('ringStudioList')); $('ringtoneModal').classList.remove('hidden');
  });
  $('closeRingModalBtn').addEventListener('click', () => { S.stopRingtone(); $('ringtoneModal').classList.add('hidden'); });
  $('ringPresetSel').addEventListener('change', (e) => { localStorage.setItem(S.CONFIG.RINGTONE_KEY, e.target.value); if (e.target.value !== 'custom_file') S.playStrongRingtone(e.target.value); });
  $('testRingBtn').addEventListener('click', () => S.playStrongRingtone());
  $('stopRingBtn').addEventListener('click', S.stopRingtone);
  $('customRingFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        localStorage.setItem('cg_v2_custom_ringtone_url', String(r.result || ''));
        localStorage.setItem(S.CONFIG.RINGTONE_KEY, 'custom_file');
        $('ringPresetSel').value = 'custom_file';
        $('customRingStatus').textContent = '✓ ' + f.name;
      } catch (_) { $('customRingStatus').textContent = '⚠️ الملف كبير جداً (أقل من 2MB)'; }
    };
    r.readAsDataURL(f);
  });

  (async function init() {
    applyTexts();
    user = await S.requireAuth(['family']);
    if (!user) return;
    await loadFamilyData();
    let famRt = null;
    function connectFamRt() {
      if (famRt || document.hidden) return;
      famRt = S.client.channel('cg-v2-fam-' + user.id)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'alerts' }, () => { S.playStrongRingtone(); loadFamilyData(); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'device_status' }, () => { loadFamilyData(); })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'safety_checkins' }, () => {
        const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const toast = $('liveCheckInToast');
        if (toast) {
          toast.textContent = S.getLang() === 'fr' ? `💚 Votre proche vient de confirmer qu'il va bien (${t})` : `💚 أكّد قريبك الآن أنه بخير (الساعة ${t})`;
          toast.classList.remove('hidden');
          setTimeout(() => toast.classList.add('hidden'), 8000);
        }
        loadFamilyData();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'care_direct_messages' }, (p) => {
        if (!p.new || p.new.channel !== 'family') return;
        if (p.new.sender_user_id !== user.id) S.playStrongRingtone();
        loadFamilyData();
        if (!$('chatModal').classList.contains('hidden')) loadChat();
      })
      .subscribe();
    }
    connectFamRt();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && famRt) { S.client.removeChannel(famRt); famRt = null; }
      else if (!document.hidden) { connectFamRt(); loadFamilyData(); }
    });
  })();
})();
</script>
</body>
</html>
