name: Build CareGuard TN Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets into www/
        run: npm run prepare:www

      - name: Generate Android project & sync Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Apply CareGuard TN Green Icon to Android
        run: |
          python3 -c '
          import os, shutil
          from pathlib import Path
          src = Path("icon-512.png") if Path("icon-512.png").exists() else Path("icon-192.png")
          if src.exists():
            res = Path("android/app/src/main/res")
            for mp in res.glob("mipmap-*"):
              for fn in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                target = mp / fn
                if target.exists():
                  shutil.copyfile(src, target)
            bg = res / "values" / "ic_launcher_background.xml"
            if bg.exists():
              bg.write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?><resources><color name=\"ic_launcher_background\">#0E5A3E</color></resources>", encoding="utf-8")
            print("Applied CareGuard TN icon from", src)
          '

      - name: Configure Android permissions & Deep Link (tn.careguard.app://callback)
        run: |
          node -e '
            const fs = require("fs");
            const mf = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(mf, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.CAMERA"
            ];
            const ins = perms.filter((p) => !xml.includes(p)).map((p) => "    <uses-permission android:name=\"" + p + "\" />");
            if (ins.length) xml = xml.replace("<application", ins.join("\n") + "\n\n    <application");
            if (!xml.includes("android:showWhenLocked")) {
              xml = xml.replace("<activity", "<activity\n            android:showWhenLocked=\"true\"\n            android:turnScreenOn=\"true\"");
            }
            const deepLink = "\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <category android:name=\"android.intent.category.BROWSABLE\" />\n                <data android:scheme=\"tn.careguard.app\" android:host=\"callback\" />\n            </intent-filter>\n        </activity>";
            if (!xml.includes("tn.careguard.app")) {
              xml = xml.replace("</activity>", deepLink);
            }
            fs.writeFileSync(mf, xml, "utf8");
            console.log("AndroidManifest.xml updated OK");
          '

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CareGuard-TN.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareGuard-TN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
