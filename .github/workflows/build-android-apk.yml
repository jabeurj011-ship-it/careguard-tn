name: Build SoinsDar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and prepare www
        run: |
          npm install
          npm run prepare:www
          if curl -fsSL -A "Mozilla/5.0" https://cdn.tailwindcss.com/3.4.17 -o www/tailwind.js && [ -s www/tailwind.js ]; then
            python3 - <<'PYEOF'
            from pathlib import Path
            for f in Path('www').glob('*.html'):
                s = f.read_text(encoding='utf-8')
                if 'https://cdn.tailwindcss.com/3.4.17' in s:
                    f.write_text(s.replace('https://cdn.tailwindcss.com/3.4.17', './tailwind.js'), encoding='utf-8')
            PYEOF
          fi

      - name: Set Android appName to SoinsDar
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          if p.exists():
              d = json.loads(p.read_text())
              d['appName'] = 'SoinsDar'
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2))
          EOF

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Set SoinsDar Android Launcher Icon
        run: |
          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path
          src = Path('icon-512.png') if Path('icon-512.png').exists() else Path('icon-192.png')
          if src.exists():
              anydpi = Path('android/app/src/main/res/mipmap-anydpi-v26')
              if anydpi.exists():
                  shutil.rmtree(anydpi)
              for d in Path('android/app/src/main/res').glob('mipmap-*'):
                  if d.is_dir():
                      shutil.copyfile(src, d / 'ic_launcher.png')
                      shutil.copyfile(src, d / 'ic_launcher_round.png')
          PYEOF

      - name: Generate 18-second custom ringtone in res/raw
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'EOF'
          import wave, math, struct
          def write_wav(path, dur, fn):
              with wave.open(path, 'w') as wf:
                  sr = 22050
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(sr)
                  frames = bytearray()
                  for i in range(sr * dur):
                      val = fn(i / sr)
                      frames += struct.pack('<h', max(-32767, min(32767, int(val * 30000))))
                  wf.writeframes(frames)

          write_wav('android/app/src/main/res/raw/careguard_ringtone.wav', 18,
              lambda t: (0.85 * (0.55 * math.sin(2 * math.pi * 740 * t) + 0.45 * math.sin(2 * math.pi * 988 * t))) if (t % 2.0) < 1.35 else 0.0)
          write_wav('android/app/src/main/res/raw/careguard_urgent.wav', 18,
              lambda t: 0.85 * math.sin(2 * math.pi * (1046.5 if (t % 0.6) < 0.3 else 1396.9) * t))
          write_wav('android/app/src/main/res/raw/careguard_bell.wav', 18,
              lambda t: (0.75 * math.exp(-((t % 1.5) % 0.3) * 4.5) * math.sin(2 * math.pi * [523.25, 659.25, 783.99, 1046.5][min(3, int((t % 1.5) / 0.3))] * t)) if (t % 1.5) < 1.25 else 0.0)
          EOF

      - name: Configure versionCode, permissions and deep link
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          bg = Path('android/app/build.gradle')
          s = bg.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ${{ github.run_number }}', s)
          bg.write_text(s)

          mf = Path('android/app/src/main/AndroidManifest.xml')
          m = mf.read_text()
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.USE_FULL_SCREEN_INTENT',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.RECORD_AUDIO',
              'android.permission.CALL_PHONE',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS'
          ]
          for p in perms:
              if p not in m:
                  m = m.replace('<application', f'<uses-permission android:name="{p}" />\n    <application', 1)
          if 'tn.careguard.app' not in m:
              intent = '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="tn.careguard.app" android:host="callback" />
            </intent-filter>'''
              m = m.replace('</activity>', intent + '\n        </activity>', 1)
          if 'android:showWhenLocked' not in m:
              m = m.replace('<activity', '<activity android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          mf.write_text(m)
          EOF

      - name: Configure Release Signing & Build APK
        env:
          REL_KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          REL_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REL_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          REL_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$REL_KS_B64" ] && [ -n "$REL_ALIAS" ] && [ -n "$REL_STORE_PASS" ] && [ -n "$REL_KEY_PASS" ]; then
            echo "$REL_KS_B64" | base64 -d > android/app/soinsdar-release.jks
            python3 - <<'PYEOF'
            from pathlib import Path
            import re
            bg = Path('android/app/build.gradle')
            s = bg.read_text()
            signing_blk = (
                '    signingConfigs {\n'
                '        release {\n'
                '            storeFile file("soinsdar-release.jks")\n'
                '            storePassword System.getenv("REL_STORE_PASS")\n'
                '            keyAlias System.getenv("REL_ALIAS")\n'
                '            keyPassword System.getenv("REL_KEY_PASS")\n'
                '        }\n'
                '    }\n'
                '    buildTypes {'
            )
            s = s.replace('    buildTypes {', signing_blk, 1)
            s = re.sub(r'(release\s*\{)', '\\1\n            signingConfig signingConfigs.release', s, count=1)
            bg.write_text(s)
            PYEOF
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../careguard-tn.apk
          else
            if [ -n "$KEYSTORE_B64" ]; then
              mkdir -p ~/.android
              echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            fi
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../careguard-tn.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careguard-tn-apk
          path: careguard-tn.apk

      - name: Publish APK to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SoinsDar — نسخة أندرويد الرسمية (APK)
          body: تحميل مباشر لتطبيق SoinsDar للأندرويد.
          files: careguard-tn.apk
          make_latest: true
