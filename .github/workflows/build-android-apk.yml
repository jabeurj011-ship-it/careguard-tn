name: Build SoinsDar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and prepare www
        run: |
          npm install
          npm run prepare:www

      - name: Set Android appName to SoinsDar
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          if p.exists():
              d = json.loads(p.read_text())
              d['appName'] = 'SoinsDar'
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2))
          EOF

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate 18-second custom ringtone in res/raw
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'EOF'
          import wave, math, struct
          with wave.open('android/app/src/main/res/raw/careguard_ringtone.wav', 'w') as wf:
              sr = 22050
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              frames = bytearray()
              for _ in range(6):
                  for i in range(int(sr * 1.2)):
                      t = i / sr
                      pulse = 1.0 if (t % 0.12) < 0.08 else 0.25
                      s = pulse * 0.5 * (math.sin(2 * math.pi * 740 * t) + math.sin(2 * math.pi * 988 * t))
                      frames += struct.pack('<h', max(-32767, min(32767, int(s * 28000))))
                  frames += b'\x00\x00' * int(sr * 1.8)
              wf.writeframes(frames)
          EOF

      - name: Configure versionCode, permissions and deep link
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re

          bg = Path('android/app/build.gradle')
          s = bg.read_text()
          s = re.sub(r'versionCode\s+\d+', 'versionCode ${{ github.run_number }}', s)
          bg.write_text(s)

          mf = Path('android/app/src/main/AndroidManifest.xml')
          m = mf.read_text()
          perms = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK'
          ]
          for p in perms:
              if p not in m:
                  m = m.replace('<application', f'<uses-permission android:name="{p}" />\n    <application', 1)
          if 'tn.careguard.app' not in m:
              intent = '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="tn.careguard.app" android:host="callback" />
            </intent-filter>'''
              m = m.replace('</activity>', intent + '\n        </activity>', 1)
          mf.write_text(m)
          EOF

      - name: Restore fixed Android debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../careguard-tn.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careguard-tn-apk
          path: careguard-tn.apk

      - name: Publish APK to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SoinsDar — نسخة أندرويد الرسمية (APK)
          body: تحميل مباشر لتطبيق SoinsDar للأندرويد.
          files: careguard-tn.apk
          make_latest: true
